<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Control Center - Training Plus Institute</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">
    <script>
        const role = localStorage.getItem('current_user_role');
        const session = localStorage.getItem('active_manager_session');
        if (role !== 'manager' || !session) {
            window.location.href = 'index.html';
        }
    </script>

    <header class="app-header manager-header">
        <div class="nav-left">
            <h2>Manager Portal</h2>
        </div>
        <div class="nav-right">
            <span class="user-badge" id="mgr-display-name">Manager</span>
            <button class="nav-btn logout-btn" onclick="logoutManager()">Logout</button>
        </div>
    </header>

    <main class="main-content">
        <div class="card-view">
            <h3>System Credentials Management</h3>
            <p style="color: #718096; margin-bottom: 20px;">Update access passcodes for Operator and Manager portal roles.</p>

            <form id="credentials-form" onsubmit="updateCredentials(event)">
                <div class="form-section">
                    <h4>Operator Access Credentials</h4>
                    <div class="grid-form">
                        <label>Operator Username
                            <input type="text" id="cfg-op-user" required>
                        </label>
                        <label>Operator Passcode
                            <input type="password" id="cfg-op-pass" required>
                        </label>
                    </div>
                </div>

                <hr style="margin: 20px 0; border: none; border-top: 1px solid #e2e8f0;">

                <div class="form-section">
                    <h4>Manager Access Credentials</h4>
                    <div class="grid-form">
                        <label>Manager Username
                            <input type="text" id="cfg-mgr-user" required>
                        </label>
                        <label>Manager Master Password
                            <input type="password" id="cfg-mgr-pass" required>
                        </label>
                    </div>
                </div>

                <div style="margin-top: 20px;">
                    <button type="submit" class="primary-btn manager-btn">Save System Credentials</button>
                </div>
            </form>
        </div>
    </main>

    <!-- Firebase SDK Compat libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script src="script.js"></script>
    <script>
        const name = localStorage.getItem('current_user_name');
        if (name) document.getElementById('mgr-display-name').textContent = name;

        function logoutManager() {
            localStorage.removeItem('active_manager_session');
            localStorage.removeItem('current_user_role');
            localStorage.removeItem('current_user_name');
            window.location.href = 'index.html';
        }

        async function loadCredentials() {
            try {
                const opSnap = await db.collection('system_credentials').doc('operator').get();
                if (opSnap.exists) {
                    const data = opSnap.data();
                    document.getElementById('cfg-op-user').value = data.username || '';
                    document.getElementById('cfg-op-pass').value = data.password || '';
                } else {
                    document.getElementById('cfg-op-user').value = 'operator';
                    document.getElementById('cfg-op-pass').value = 'op1234';
                }

                const mgrSnap = await db.collection('system_credentials').doc('manager').get();
                if (mgrSnap.exists) {
                    const data = mgrSnap.data();
                    document.getElementById('cfg-mgr-user').value = data.username || '';
                    document.getElementById('cfg-mgr-pass').value = data.password || '';
                } else {
                    document.getElementById('cfg-mgr-user').value = 'admin';
                    document.getElementById('cfg-mgr-pass').value = 'admin1234';
                }
            } catch (err) {
                console.error("Error loading credentials:", err);
            }
        }

        async function updateCredentials(e) {
            e.preventDefault();
            const opUser = document.getElementById('cfg-op-user').value.trim();
            const opPass = document.getElementById('cfg-op-pass').value.trim();
            const mgrUser = document.getElementById('cfg-mgr-user').value.trim();
            const mgrPass = document.getElementById('cfg-mgr-pass').value.trim();

            try {
                await db.collection('system_credentials').doc('operator').set({ username: opUser, password: opPass });
                await db.collection('system_credentials').doc('manager').set({ username: mgrUser, password: mgrPass });
                alert("System credentials updated successfully!");
            } catch (err) {
                alert("Failed to update credentials: " + err.message);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadCredentials();
        });
    </script>
</body>
</html>
