<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operator Dashboard</title>
  <!-- XLSX Library for Excel Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
        --bg-color: #f2f7f5;
        --card-bg: #ffffff;
        --text-primary: #2d3748;
        --text-muted: #718096;
        --border-color: #e2e8f0;
        --accent-mint: #a8e6cf;
        --accent-mint-dark: #81c784;
        --accent-slate-blue: #709fb0;
        --danger-red: #e57373;
        --valid-green: #38a169;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-primary);
        padding-bottom: 70px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    /* Header & Navigation */
    .top-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: var(--accent-slate-blue);
        padding: 12px 24px;
        color: white;
    }

    .nav-left {
        display: flex;
        align-items: center;
        gap: 16px;
    }

    .nav-controls {
        display: flex;
        gap: 8px;
    }

    .nav-btn {
        background-color: rgba(255, 255, 255, 0.2);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.3);
        padding: 7px 14px;
        border-radius: 18px;
        cursor: pointer;
        font-size: 0.85rem;
        transition: background-color 0.2s ease;
    }

    .nav-btn:hover { background-color: rgba(255, 255, 255, 0.35); }

    /* Main Container & Cards */
    main {
        flex: 1;
        width: 100%;
    }

    .card-view {
        max-width: 800px;
        margin: 30px auto;
        background: var(--card-bg);
        padding: 28px;
        border-radius: 16px;
        border: 1px solid #e8f0ec;
        box-shadow: 0 8px 20px rgba(0,0,0,0.04);
    }

    .view { display: none; }
    .view.active { display: block; }

    /* Forms & Inputs */
    .standard-form {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .standard-form label, .grid-form label {
        display: flex;
        flex-direction: column;
        font-size: 0.88rem;
        gap: 4px;
        font-weight: 600;
    }

    .standard-form input, .grid-form input, .grid-form select {
        padding: 10px 12px;
        border: 1.5px solid var(--border-color);
        border-radius: 8px;
        outline: none;
        font-size: 0.9rem;
    }

    .standard-form input:focus, .grid-form input:focus, .grid-form select:focus {
        border-color: var(--accent-slate-blue);
    }

    .standard-form input:disabled, .grid-form input:disabled {
        background-color: #edf2f7;
        color: var(--text-muted);
        cursor: not-allowed;
    }

    .primary-btn {
        background-color: var(--accent-mint);
        color: #2c5244;
        border: none;
        padding: 10px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: background-color 0.2s ease, color 0.2s ease;
    }

    .primary-btn:hover { background-color: var(--accent-mint-dark); color: white; }

    .secondary-btn {
        background-color: #edf2f0;
        color: var(--text-muted);
        border: none;
        padding: 10px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
    }

    .secondary-btn:hover {
        background-color: var(--border-color);
        color: var(--text-primary);
    }

    /* Grid Display for Courses & Classes */
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 16px;
        margin-top: 1rem;
    }

    .grid-item {
        background: var(--card-bg);
        padding: 1.5rem;
        border-radius: 12px;
        border: 1px solid #e1ebe6;
        text-align: center;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.2s ease;
    }

    .grid-item:hover {
        border-color: var(--accent-slate-blue);
        color: var(--accent-slate-blue);
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(112, 159, 176, 0.15);
    }

    .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }

    /* Student Directory Table */
    table {
        width: 100%;
        border-collapse: collapse;
        background: var(--card-bg);
        margin-top: 1rem;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid var(--border-color);
    }

    th, td {
        border: 1px solid var(--border-color);
        padding: 12px 14px;
        text-align: left;
        font-size: 0.88rem;
    }

    th {
        background-color: #f4f9f7;
        font-weight: 600;
    }

    /* RTL Adjustments */
    body[dir="rtl"] { direction: rtl; text-align: right; }
    body[dir="rtl"] th, body[dir="rtl"] td { text-align: right; }

    /* Bottom Footer */
    .bottom-footer {
        position: fixed; bottom: 0; left: 0; width: 100%;
        background-color: #1a202c; color: #a0aec0; text-align: center;
        padding: 8px; font-size: 0.82rem; z-index: 900;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="top-nav">
    <div class="nav-left">
      <h2 style="font-size: 1.25rem; font-weight: 600;">Operator Portal</h2>
    </div>
    <div class="nav-controls">
      <button class="nav-btn" onclick="showView('home-view')">Home</button>
      <button class="nav-btn" onclick="showView('courses-view')">Courses</button>
      <button class="nav-btn" onclick="toggleLanguage()" id="lang-btn">AR/EN</button>
      <button class="nav-btn" onclick="showView('account-view')">Account</button>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <!-- Home View: Add Course -->
    <section id="home-view" class="card-view view active">
      <h3 style="margin-bottom: 16px;">Add New Course</h3>
      <form id="add-course-form" class="standard-form" onsubmit="addCourse(event)">
        <label for="course-name">
          Course Name
          <input type="text" id="course-name" required placeholder="e.g., Web Development">
        </label>
        <div>
          <button type="submit" class="primary-btn">Add Course</button>
        </div>
      </form>
    </section>

    <!-- Courses View -->
    <section id="courses-view" class="card-view view">
      <h3 style="margin-bottom: 16px;">Available Courses</h3>
      <div id="courses-list" class="grid"></div>
    </section>

    <!-- Account View -->
    <section id="account-view" class="card-view view">
      <h3 style="margin-bottom: 16px;">Account Settings</h3>
      <form id="account-form" class="standard-form" onsubmit="saveAccountDetails(event)">
        <label for="acc-email">
          Signed-In Email (Default / Locked)
          <input type="email" id="acc-email" disabled>
        </label>
        <label for="acc-name">
          Operator Name
          <input type="text" id="acc-name" placeholder="Enter your full name" required>
        </label>
        <label for="acc-phone">
          Phone Number
          <input type="text" id="acc-phone" placeholder="Enter your phone number">
        </label>
        <label for="acc-role">
          Role / Department
          <select id="acc-role">
            <option value="System Administrator">System Administrator</option>
            <option value="Operator">Operator</option>
            <option value="Course Coordinator">Course Coordinator</option>
          </select>
        </label>
        <div>
          <button type="submit" class="primary-btn">Save Changes</button>
        </div>
      </form>
    </section>

    <!-- Classes View -->
    <section id="classes-view" class="card-view view">
      <button class="secondary-btn" onclick="showView('courses-view')" style="margin-bottom: 1rem;">&larr; Back to Courses</button>
      <h3 id="current-course-title" style="margin-bottom: 16px;">Classes</h3>
      
      <div style="margin-top: 1rem; border-top: 1px solid var(--border-color); padding-top: 16px;">
        <h4 style="margin-bottom: 12px;">Add New Class</h4>
        <form id="add-class-form" class="standard-form" onsubmit="addClass(event)">
          <label for="class-name">
            Class Name / Code
            <input type="text" id="class-name" required placeholder="e.g., Class A - Morning">
          </label>
          <div>
            <button type="submit" class="primary-btn">Add Class</button>
          </div>
        </form>
      </div>

      <div id="classes-list" class="grid" style="margin-top: 20px;"></div>
    </section>

    <!-- Class Detail View (Students Table) -->
    <section id="students-view" class="card-view view">
      <button class="secondary-btn" onclick="showView('classes-view')" style="margin-bottom: 1rem;">&larr; Back to Classes</button>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 id="current-class-title" style="margin: 0;">Student Records</h3>
        <button onclick="exportToExcel()" class="primary-btn">Download Excel</button>
      </div>

      <!-- Add Student Form -->
      <div style="background: #f8faf9; padding: 16px; border-radius: 12px; border: 1px solid #e1ebe6; margin-bottom: 20px;">
        <h4 style="margin-bottom: 12px;">Add Student Record</h4>
        <form id="add-student-form" class="grid-form" onsubmit="addStudent(event)">
          <label>
            Student Name
            <input type="text" id="std-name" required>
          </label>
          <label>
            Student CPR
            <input type="text" id="std-cpr" required>
          </label>
          <label>
            Tamkeen Status
            <select id="std-status">
              <option value="Accepted">Accepted</option>
              <option value="Under Processing">Under Processing</option>
              <option value="Withdrawn">Withdrawn</option>
            </select>
          </label>
          <label>
            Comment
            <input type="text" id="std-comment">
          </label>
          <div style="grid-column: 1 / -1; display: flex; align-items: flex-end;">
            <button type="submit" class="primary-btn">Add Student</button>
          </div>
        </form>
      </div>

      <!-- Students Table -->
      <table id="students-table">
        <thead>
          <tr>
            <th>Student Name</th>
            <th>Student CPR</th>
            <th>Tamkeen Status</th>
            <th>Comment</th>
          </tr>
        </thead>
        <tbody id="students-table-body">
          <!-- Data populated dynamically -->
        </tbody>
      </table>
    </section>
  </main>

  <!-- Footer -->
  <footer class="bottom-footer">
    <span id="datetime">Loading time...</span>
  </footer>

  <script>
    // State Data Structure
    let state = {
      userEmail: "operator@institute.com", // Default signed-in email
      accountDetails: {
        name: "Admin Operator",
        phone: "+973 36000000",
        role: "System Administrator"
      },
      courses: [],
      selectedCourseIndex: null,
      selectedClassIndex: null,
      currentLang: 'EN'
    };

    // Initialize Account Page Data
    function initAccountDetails() {
      // Set fixed signed-in email
      document.getElementById('acc-email').value = state.userEmail;
      
      // Set editable defaults
      document.getElementById('acc-name').value = state.accountDetails.name;
      document.getElementById('acc-phone').value = state.accountDetails.phone;
      document.getElementById('acc-role').value = state.accountDetails.role;
    }

    // Navigation Handler
    function showView(viewId) {
      document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
    }

    // Language Toggle
    function toggleLanguage() {
      state.currentLang = state.currentLang === 'EN' ? 'AR' : 'EN';
      document.getElementById('lang-btn').innerText = state.currentLang === 'EN' ? 'AR/EN' : 'EN/AR';
      document.body.dir = state.currentLang === 'AR' ? 'rtl' : 'ltr';
    }

    // Account Form Save
    function saveAccountDetails(e) {
      e.preventDefault();
      state.accountDetails.name = document.getElementById('acc-name').value;
      state.accountDetails.phone = document.getElementById('acc-phone').value;
      state.accountDetails.role = document.getElementById('acc-role').value;
      alert('Account details updated successfully!');
    }

    // Add Course
    function addCourse(e) {
      e.preventDefault();
      const input = document.getElementById('course-name');
      state.courses.push({ name: input.value, classes: [] });
      input.value = '';
      renderCourses();
      showView('courses-view');
    }

    // Render Courses List
    function renderCourses() {
      const container = document.getElementById('courses-list');
      container.innerHTML = '';
      state.courses.forEach((course, index) => {
        const div = document.createElement('div');
        div.className = 'grid-item';
        div.innerText = course.name;
        div.onclick = () => openCourse(index);
        container.appendChild(div);
      });
    }

    // Open Specific Course
    function openCourse(index) {
      state.selectedCourseIndex = index;
      document.getElementById('current-course-title').innerText = `Classes for ${state.courses[index].name}`;
      renderClasses();
      showView('classes-view');
    }

    // Add Class
    function addClass(e) {
      e.preventDefault();
      const input = document.getElementById('class-name');
      state.courses[state.selectedCourseIndex].classes.push({ name: input.value, students: [] });
      input.value = '';
      renderClasses();
    }

    // Render Classes List
    function renderClasses() {
      const container = document.getElementById('classes-list');
      container.innerHTML = '';
      const currentClasses = state.courses[state.selectedCourseIndex].classes;
      currentClasses.forEach((cls, index) => {
        const div = document.createElement('div');
        div.className = 'grid-item';
        div.innerText = cls.name;
        div.onclick = () => openClass(index);
        container.appendChild(div);
      });
    }

    // Open Specific Class
    function openClass(index) {
      state.selectedClassIndex = index;
      const cls = state.courses[state.selectedCourseIndex].classes[index];
      document.getElementById('current-class-title').innerText = `Students - ${cls.name}`;
      renderStudents();
      showView('students-view');
    }

    // Add Student
    function addStudent(e) {
      e.preventDefault();
      const name = document.getElementById('std-name').value;
      const cpr = document.getElementById('std-cpr').value;
      const status = document.getElementById('std-status').value;
      const comment = document.getElementById('std-comment').value;

      state.courses[state.selectedCourseIndex].classes[state.selectedClassIndex].students.push({
        name, cpr, status, comment
      });

      document.getElementById('add-student-form').reset();
      renderStudents();
    }

    // Render Students Table
    function renderStudents() {
      const tbody = document.getElementById('students-table-body');
      tbody.innerHTML = '';
      const students = state.courses[state.selectedCourseIndex].classes[state.selectedClassIndex].students;

      students.forEach(std => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${std.name}</td>
          <td>${std.cpr}</td>
          <td>${std.status}</td>
          <td>${std.comment}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Export Table to Excel
    function exportToExcel() {
      const table = document.getElementById('students-table');
      const workbook = XLSX.utils.table_to_book(table, { sheet: "Students" });
      XLSX.writeFile(workbook, "student_records.xlsx");
    }

    // Footer Live Date & Time
    function updateDateTime() {
      const now = new Date();
      document.getElementById('datetime').innerText = now.toLocaleString();
    }

    // Initialize Page
    initAccountDetails();
    setInterval(updateDateTime, 1000);
    updateDateTime();
  </script>
<script src="script.js"></script>
</body>
</html>
