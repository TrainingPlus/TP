<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Dashboard - Training Plus Institute</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="dashboard-body">
    <script>
        const role = localStorage.getItem('current_user_role');
        const session = localStorage.getItem('active_operator_session');
        if (role !== 'operator' || !session) {
            window.location.href = 'index.html';
        }
    </script>

    <header class="app-header">
        <div class="nav-left">
            <h2>Operator Portal</h2>
        </div>
        <div class="nav-right">
            <span class="user-badge" id="op-display-name">Operator</span>
            <button class="nav-btn logout-btn" onclick="logoutOperator()">Logout</button>
        </div>
    </header>

    <main class="main-content">
        <div class="card-view">
            <div class="directory-header">
                <h3>Global Directory Overview</h3>
                <button class="nav-btn download-btn" onclick="downloadGlobalExcel()">Export All Students (Excel)</button>
            </div>
            <p style="color: #718096; margin-bottom: 15px;">Monitor and manage student records across all accounts.</p>
            
            <div id="operator-student-list" class="student-list">
                <p style="text-align: center; color: #a0aec0;">Loading global student records...</p>
            </div>
        </div>
    </main>

    <!-- Firebase SDK Compat libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script src="script.js"></script>
    <script>
        const name = localStorage.getItem('current_user_name');
        if (name) document.getElementById('op-display-name').textContent = name;

        function logoutOperator() {
            localStorage.removeItem('active_operator_session');
            localStorage.removeItem('current_user_role');
            localStorage.removeItem('current_user_name');
            window.location.href = 'index.html';
        }

        let globalStudents = [];

        function loadGlobalStudents() {
            db.collection('students').onSnapshot(snapshot => {
                globalStudents = [];
                snapshot.forEach(doc => {
                    globalStudents.push({ id: doc.id, ...doc.data() });
                });
                renderOperatorDirectory(globalStudents);
            });
        }

        function renderOperatorDirectory(list) {
            const container = document.getElementById('operator-student-list');
            if (!container) return;
            container.innerHTML = "";

            if (list.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#a0aec0; padding:20px;">No records available.</p>`;
                return;
            }

            list.forEach(student => {
                const item = document.createElement('div');
                item.className = "student-item";
                item.innerHTML = `
                    <div class="student-header" onclick="this.nextElementSibling.classList.toggle('hidden')">
                        <span><strong>${student.name || 'Unnamed Student'}</strong> (${student.cpr})</span>
                        <span style="font-size:0.8rem; color:#718096;">Added By: ${student.createdByName || student.added_by || 'Unknown'}</span>
                    </div>
                    <div class="student-details hidden">
                        <div class="grid-form">
                            <label>Full Name:
                                <input type="text" value="${student.name || ''}" onchange="updateStudentField('${student.id}', 'name', this.value)">
                            </label>
                            <label>Student Number:
                                <input type="text" value="${student.studentNumber || ''}" onchange="updateStudentField('${student.id}', 'studentNumber', this.value)">
                            </label>
                            <label>Major:
                                <input type="text" value="${student.major || ''}" onchange="updateStudentField('${student.id}', 'major', this.value)">
                            </label>
                            <label>CPR Number:
                                <input type="text" value="${student.cpr}" readonly>
                            </label>
                        </div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function downloadGlobalExcel() {
            if (globalStudents.length === 0) {
                alert("No student records available.");
                return;
            }
            const rows = globalStudents.map(s => ({
                "Full Name": s.name || '',
                "Student Number": s.studentNumber || '',
                "Major": s.major || '',
                "CPR": s.cpr || '',
                "Added By": s.createdByName || s.added_by || ''
            }));
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.json_to_sheet(rows);
            XLSX.utils.book_append_sheet(wb, ws, "Global Student Records");
            XLSX.writeFile(wb, `Global_Students_${new Date().toISOString().slice(0, 10)}.xlsx`);
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadGlobalStudents();
        });
    </script>
</body>
</html>
