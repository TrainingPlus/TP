<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Portal - Course & Class Management</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase SDKs (v9/v10 Compatibility Mode) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
</head>
<body>

    <header class="header">
        <div class="header-content">
            <h1>Operator Portal</h1>
            <div class="user-info">
                <span id="operator-email-display">Loading operator session...</span>
                <button id="logoutBtn" onclick="logoutUser()" class="btn btn-secondary">Logout</button>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <h2>Assigned Courses & Classes</h2>
            <p class="subtitle" style="margin-bottom: 20px; color: var(--text-muted, #666);">
                View manager-created courses, add/edit/delete classes, and manage student Tamkeen status.
            </p>
            
            <div id="courses-list-container">
                <p class="loading-text">Loading courses from manager...</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Helper function to escape HTML to prevent XSS
        function escapeHTML(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // Restrict page access strictly to the Operator
        auth.onAuthStateChanged((user) => {
            if (user) {
                const userEmail = (user.email || "").toLowerCase();
                const targetEmail = (typeof ALLOWED_OPERATOR_EMAIL !== "undefined" ? ALLOWED_OPERATOR_EMAIL : "").toLowerCase();
                
                if (targetEmail && userEmail !== targetEmail) {
                    alert("Access Denied: You are not authorized to view the Operator portal.");
                    auth.signOut();
                    window.location.href = "index.html";
                    return;
                }
                
                document.getElementById('operator-email-display').innerText = `Operator: ${user.email}`;
                loadManagerCourses();
            } else {
                window.location.href = "index.html";
            }
        });

        // Load courses added by Manager
        function loadManagerCourses() {
            db.collection("courses").onSnapshot((snapshot) => {
                const container = document.getElementById("courses-list-container");
                container.innerHTML = "";

                if (snapshot.empty) {
                    container.innerHTML = "<p>No courses have been added by the manager yet.</p>";
                    return;
                }

                snapshot.forEach((doc) => {
                    const course = doc.data();
                    const courseId = doc.id;

                    const courseCard = document.createElement("div");
                    courseCard.className = "card";
                    courseCard.style.marginTop = "20px";
                    courseCard.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px;">
                            <h3 style="margin: 0;">${escapeHTML(course.courseName || "Unnamed Course")}</h3>
                            <button class="btn btn-primary" onclick="addClassToCourse('${courseId}')">+ Add Class</button>
                        </div>
                        <div id="classes-container-${courseId}">
                            <p class="loading-text">Loading classes...</p>
                        </div>
                    `;
                    container.appendChild(courseCard);

                    loadClassesForCourse(courseId);
                });
            }, (error) => {
                console.error("Error loading courses:", error);
            });
        }

        // Add a new Class under a specific Course
        async function addClassToCourse(courseId) {
            const className = prompt("Enter Class Name (e.g., Batch A, Class 101):");
            if (!className || !className.trim()) return;

            try {
                await db.collection("courses").doc(courseId).collection("classes").add({
                    className: className.trim(),
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("Class added successfully!");
            } catch (error) {
                console.error("Error adding class:", error);
                alert("Failed to add class: " + error.message);
            }
        }

        // Edit Class Name
        async function editClassName(courseId, classId, currentName) {
            const newName = prompt("Edit Class Name:", currentName);
            if (!newName || !newName.trim() || newName.trim() === currentName) return;

            try {
                await db.collection("courses").doc(courseId)
                    .collection("classes").doc(classId).update({
                        className: newName.trim()
                    });
                alert("Class updated successfully!");
            } catch (error) {
                console.error("Error updating class:", error);
                alert("Failed to update class: " + error.message);
            }
        }

        // Delete Class
        async function deleteClass(courseId, classId, className) {
            if (!confirm(`Are you sure you want to delete class "${className}" and all its records?`)) return;

            try {
                await db.collection("courses").doc(courseId)
                    .collection("classes").doc(classId).delete();
                alert("Class deleted successfully!");
            } catch (error) {
                console.error("Error deleting class:", error);
                alert("Failed to delete class: " + error.message);
            }
        }

        // Load Classes and Student Tables for a Course
        function loadClassesForCourse(courseId) {
            db.collection("courses").doc(courseId).collection("classes").onSnapshot((snapshot) => {
                const classesContainer = document.getElementById(`classes-container-${courseId}`);
                if (!classesContainer) return;
                classesContainer.innerHTML = "";

                if (snapshot.empty) {
                    classesContainer.innerHTML = "<p class='no-data'>No classes added for this course yet.</p>";
                    return;
                }

                snapshot.forEach((classDoc) => {
                    const classData = classDoc.data();
                    const classId = classDoc.id;
                    const cName = classData.className || "Unnamed Class";

                    const classBox = document.createElement("div");
                    classBox.style.background = "#f9f9f9";
                    classBox.style.padding = "15px";
                    classBox.style.borderRadius = "8px";
                    classBox.style.marginBottom = "15px";
                    
                    const safeNameAttr = escapeHTML(cName).replace(/'/g, "\\'");

                    classBox.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <h4 style="margin: 0;">Class: ${escapeHTML(cName)}</h4>
                                <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 12px;" onclick="editClassName('${courseId}', '${classId}', '${safeNameAttr}')">✏️ Edit</button>
                                <button class="btn btn-danger" style="padding: 4px 8px; font-size: 12px;" onclick="deleteClass('${courseId}', '${classId}', '${safeNameAttr}')">🗑️ Delete</button>
                            </div>
                            <button class="btn btn-primary" style="padding: 6px 12px; font-size: 13px;" onclick="addStudentToClass('${courseId}', '${classId}')">+ Add Student</button>
                        </div>
                        <div style="overflow-x: auto;">
                            <table style="width: 100%; border-collapse: collapse;">
                                <thead>
                                    <tr style="border-bottom: 2px solid #ddd; text-align: left;">
                                        <th style="padding: 8px;">Student Name</th>
                                        <th style="padding: 8px;">Student CPR</th>
                                        <th style="padding: 8px;">Tamkeen Status</th>
                                        <th style="padding: 8px;">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="students-tbody-${courseId}-${classId}">
                                    <tr><td colspan="4" class="loading-text" style="padding: 8px;">Loading students...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    `;
                    classesContainer.appendChild(classBox);

                    loadStudentsForClass(courseId, classId);
                });
            });
        }

        // Add a Student to a Class
        async function addStudentToClass(courseId, classId) {
            const studentName = prompt("Enter Student Name:");
            if (!studentName || !studentName.trim()) return;

            const cpr = prompt("Enter Student CPR (9 Digits):");
            if (!cpr || !/^\d{9}$/.test(cpr.trim())) {
                alert("Please enter a valid 9-digit CPR number.");
                return;
            }

            try {
                await db.collection("courses").doc(courseId)
                    .collection("classes").doc(classId)
                    .collection("students").doc(cpr.trim()).set({
                        studentName: studentName.trim(),
                        cpr: cpr.trim(),
                        tamkeenStatus: "Under Process",
                        addedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
            } catch (error) {
                console.error("Error adding student:", error);
                alert("Failed to add student: " + error.message);
            }
        }

        // Edit Student Name
        async function editStudentName(courseId, classId, studentId, currentName) {
            const newName = prompt("Edit Student Name:", currentName);
            if (!newName || !newName.trim() || newName.trim() === currentName) return;

            try {
                await db.collection("courses").doc(courseId)
                    .collection("classes").doc(classId)
                    .collection("students").doc(studentId).update({
                        studentName: newName.trim()
                    });
                alert("Student updated successfully!");
            } catch (error) {
                console.error("Error updating student:", error);
                alert("Failed to update student: " + error.message);
            }
        }

        // Delete Student
        async function deleteStudent(courseId, classId, studentId, studentName) {
            if (!confirm(`Are you sure you want to delete student "${studentName}"?`)) return;

            try {
                await db.collection("courses").doc(courseId)
                    .collection("classes").doc(classId)
                    .collection("students").doc(studentId).delete();
                alert("Student deleted successfully!");
            } catch (error) {
                console.error("Error deleting student:", error);
                alert("Failed to delete student: " + error.message);
            }
        }

        // Load Students and render the Tamkeen Status dropdown with Actions
        function loadStudentsForClass(courseId, classId) {
            db.collection("courses").doc(courseId)
                .collection("classes").doc(classId)
                .collection("students").onSnapshot((snapshot) => {
                    const tbody = document.getElementById(`students-tbody-${courseId}-${classId}`);
                    if (!tbody) return;
                    tbody.innerHTML = "";

                    if (snapshot.empty) {
                        tbody.innerHTML = `<tr><td colspan="4" class="no-data" style="padding: 8px;">No students registered in this class.</td></tr>`;
                        return;
                    }

                    snapshot.forEach((studentDoc) => {
                        const student = studentDoc.data();
                        const studentId = studentDoc.id;
                        const currentStatus = student.tamkeenStatus || "Under Process";
                        const sName = student.studentName || "N/A";
                        const safeStudentName = escapeHTML(sName).replace(/'/g, "\\'");

                        const row = document.createElement("tr");
                        row.style.borderBottom = "1px solid #eee";
                        row.innerHTML = `
                            <td style="padding: 8px;">${escapeHTML(sName)}</td>
                            <td style="padding: 8px;">${escapeHTML(student.cpr || studentId)}</td>
                            <td style="padding: 8px;">
                                <select style="padding: 4px 8px; border-radius: 4px; border: 1px solid #ccc;" 
                                        onchange="updateTamkeenStatus('${courseId}', '${classId}', '${studentId}', this.value)">
                                    <option value="Accepted" ${currentStatus === 'Accepted' ? 'selected' : ''}>Accepted</option>
                                    <option value="Under Process" ${currentStatus === 'Under Process' ? 'selected' : ''}>Under Process</option>
                                    <option value="Withdrawn" ${currentStatus === 'Withdrawn' ? 'selected' : ''}>Withdrawn</option>
                                </select>
                            </td>
                            <td style="padding: 8px;">
                                <button class="btn btn-secondary" style="padding: 2px 6px; font-size: 12px;" onclick="editStudentName('${courseId}', '${classId}', '${studentId}', '${safeStudentName}')">✏️ Edit</button>
                                <button class="btn btn-danger" style="padding: 2px 6px; font-size: 12px;" onclick="deleteStudent('${courseId}', '${classId}', '${studentId}', '${safeStudentName}')">🗑️ Delete</button>
                            </td>
                        `;
                        tbody.appendChild(row);
                    });
                });
        }

        // Update student's Tamkeen status in Firestore
        async function updateTamkeenStatus(courseId, classId, studentId, newStatus) {
            try {
                await db.collection("courses").doc(courseId)
                    .collection("classes").doc(classId)
                    .collection("students").doc(studentId).update({
                        tamkeenStatus: newStatus
                    });
            } catch (error) {
                console.error("Error updating Tamkeen status:", error);
                alert("Failed to update status: " + error.message);
            }
        }
    </script>
</body>
</html>
