<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Portal - Course & Class Management</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

    <header class="app-header">
        <div class="header-container">
            <h1>Operator Portal</h1>
            <div class="user-controls">
                <span id="operator-email-display">Loading operator session...</span>
                <button id="logoutBtn" onclick="logoutUser()" class="btn-logout">Logout</button>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="portal-section">
            <h2>Assigned Courses & Classes</h2>
            <p class="subtitle">View manager-created courses, add classes, and manage student Tamkeen status.</p>
            
            <div id="courses-list-container" class="courses-container">
                <p class="loading-text">Loading courses from manager...</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
    <script>
        // Restrict page access strictly to the Operator
        auth.onAuthStateChanged((user) => {
            if (user) {
                const userEmail = (user.email || "").toLowerCase();
                if (userEmail !== ALLOWED_OPERATOR_EMAIL.toLowerCase()) {
                    alert("Access Denied: You are not authorized to view the Operator portal.");
                    auth.signOut();
                    window.location.href = "index.html";
                    return;
                }
                
                document.getElementById('operator-email-display').innerText = `Operator: ${user.email}`;
                loadManagerCourses();
            } else {
                window.location.href = "index.html";
            }
        });

        // Load courses added by Manager
        function loadManagerCourses() {
            db.collection("courses").onSnapshot((snapshot) => {
                const container = document.getElementById("courses-list-container");
                container.innerHTML = "";

                if (snapshot.empty) {
                    container.innerHTML = "<p>No courses have been added by the manager yet.</p>";
                    return;
                }

                snapshot.forEach((doc) => {
                    const course = doc.data();
                    const courseId = doc.id;

                    const courseCard = document.createElement("div");
                    courseCard.className = "course-card";
                    courseCard.innerHTML = `
                        <div class="course-header">
                            <h3>${escapeHTML(course.courseName || "Unnamed Course")}</h3>
                            <button class="btn-primary" onclick="addClassToCourse('${courseId}')">+ Add Class</button>
                        </div>
                        <div id="classes-container-${courseId}" class="classes-container">
                            <p class="loading-text">Loading classes...</p>
                        </div>
                    `;
                    container.appendChild(courseCard);

                    loadClassesForCourse(courseId);
                });
            });
        }

        // Add a new Class under a specific Course
        async function addClassToCourse(courseId) {
            const className = prompt("Enter Class Name (e.g., Batch A, Class 101):");
            if (!className || !className.trim()) return;

            try {
                await db.collection("courses").doc(courseId).collection("classes").add({
                    className: className.trim(),
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("Class added successfully!");
            } catch (error) {
                console.error("Error adding class:", error);
                alert("Failed to add class: " + error.message);
            }
        }

        // Load Classes and Student Tables for a Course
        function loadClassesForCourse(courseId) {
            db.collection("courses").doc(courseId).collection("classes").onSnapshot((snapshot) => {
                const classesContainer = document.getElementById(`classes-container-${courseId}`);
                classesContainer.innerHTML = "";

                if (snapshot.empty) {
                    classesContainer.innerHTML = "<p class='no-data'>No classes added for this course yet.</p>";
                    return;
                }

                snapshot.forEach((classDoc) => {
                    const classData = classDoc.data();
                    const classId = classDoc.id;

                    const classBox = document.createElement("div");
                    classBox.className = "class-box";
                    classBox.innerHTML = `
                        <div class="class-title-row">
                            <h4>Class: ${escapeHTML(classData.className)}</h4>
                            <button class="btn-secondary" onclick="addStudentToClass('${courseId}', '${classId}')">+ Add Student</button>
                        </div>
                        <div class="table-responsive">
                            <table class="student-table">
                                <thead>
                                    <tr>
                                        <th>Student Name</th>
                                        <th>Student CPR</th>
                                        <th>Tamkeen Status</th>
                                    </tr>
                                </thead>
                                <tbody id="students-tbody-${courseId}-${classId}">
                                    <tr><td colspan="3" class="loading-text">Loading students...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    `;
                    classesContainer.appendChild(classBox);

                    loadStudentsForClass(courseId, classId);
                });
            });
        }

        // Add a Student to a Class
        async function addStudentToClass(courseId, classId) {
            const studentName = prompt("Enter Student Name:");
            if (!studentName || !studentName.trim()) return;

            const cpr = prompt("Enter Student CPR (9 Digits):");
            if (!cpr || !/^\d{9}$/.test(cpr.trim())) {
                alert("Please enter a valid 9-digit CPR number.");
                return;
            }

            try {
                await db.collection("courses").doc(courseId)
                    .collection("classes").doc(classId)
                    .collection("students").doc(cpr.trim()).set({
                        studentName: studentName.trim(),
                        cpr: cpr.trim(),
                        tamkeenStatus: "Under Process",
                        addedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
            } catch (error) {
                console.error("Error adding student:", error);
                alert("Failed to add student: " + error.message);
            }
        }

        // Load Students and render the Tamkeen Status dropdown
        function loadStudentsForClass(courseId, classId) {
            db.collection("courses").doc(courseId)
                .collection("classes").doc(classId)
                .collection("students").onSnapshot((snapshot) => {
                    const tbody = document.getElementById(`students-tbody-${courseId}-${classId}`);
                    tbody.innerHTML = "";

                    if (snapshot.empty) {
                        tbody.innerHTML = `<tr><td colspan="3" class="no-data">No students registered in this class.</td></tr>`;
                        return;
                    }

                    snapshot.forEach((studentDoc) => {
                        const student = studentDoc.data();
                        const studentId = studentDoc.id;
                        const currentStatus = student.tamkeenStatus || "Under Process";

                        const row = document.createElement("tr");
                        row.innerHTML = `
                            <td>${escapeHTML(student.studentName || "N/A")}</td>
                            <td>${escapeHTML(student.cpr || studentId)}</td>
                            <td>
                                <select class="status-select status-${currentStatus.toLowerCase().replace(/\s+/g, '-')}" 
                                        onchange="updateTamkeenStatus('${courseId}', '${classId}', '${studentId}', this.value)">
                                    <option value="Accepted" ${currentStatus === 'Accepted' ? 'selected' : ''}>Accepted</option>
                                    <option value="Under Process" ${currentStatus === 'Under Process' ? 'selected' : ''}>Under Process</option>
                                    <option value="Withdrawn" ${currentStatus === 'Withdrawn' ? 'selected' : ''}>Withdrawn</option>
                                </select>
                            </td>
                        `;
                        tbody.appendChild(row);
                    });
                });
        }

        // Update student's Tamkeen status in Firestore
        async function updateTamkeenStatus(courseId, classId, studentId, newStatus) {
            try {
                await db.collection("courses").doc(courseId)
                    .collection("classes").doc(classId)
                    .collection("students").doc(studentId).update({
                        tamkeenStatus: newStatus
                    });
            } catch (error) {
                console.error("Error updating Tamkeen status:", error);
                alert("Failed to update status: " + error.message);
            }
        }
    </script>
</body>
</html>
