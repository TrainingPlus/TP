<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Portal - Course & Class Management</title>
    
    <!-- Firebase SDKs (v9/v10 Compatibility Mode) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    
    <!-- SheetJS for Excel Export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-mint: #5eead4;
            --accent-blue: #38bdf8;
            --danger-red: #f87171;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Header Navigation */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #operator-email-display {
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            font-size: 0.85rem;
            color: var(--accent-mint);
        }

        /* Responsive 3-Column Grid for Courses & Classes */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        @media (max-width: 992px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }

        /* Card Styling & Hover Dynamics */
        .square-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 160px;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }

        .square-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
            border-color: var(--accent-mint);
        }

        .square-card h3, .square-card h4 {
            font-size: 1.1rem;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .square-card p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Buttons */
        .nav-btn, .primary-btn, .secondary-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .primary-btn {
            background: linear-gradient(135deg, var(--accent-mint), var(--accent-blue));
            color: #0f172a;
        }

        .primary-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .secondary-btn {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .secondary-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .logout-btn {
            background: rgba(248, 113, 113, 0.15);
            color: var(--danger-red);
            border: 1px solid rgba(248, 113, 113, 0.3);
        }

        .logout-btn:hover {
            background: var(--danger-red);
            color: #fff;
        }

        /* Table Design */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background: rgba(255, 255, 255, 0.03);
            color: var(--accent-blue);
        }

        main {
            padding: 2rem;
            flex: 1;
        }

        .hidden { display: none !important; }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .bottom-footer {
            text-align: center;
            padding: 1rem;
            border-top: 1px solid var(--border-color);
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header class="top-nav">
        <h2>Operator Portal</h2>
        <div class="nav-controls">
            <button class="nav-btn secondary-btn" onclick="showCoursesView()">Courses</button>
            <span id="operator-email-display">Authenticating...</span>
            <button class="nav-btn secondary-btn" onclick="toggleLanguage()" id="lang-btn">EN / AR</button>
            <button id="logoutBtn" onclick="handleLogout()" class="nav-btn logout-btn">Logout</button>
        </div>
    </header>

    <!-- Main Dynamic Views -->
    <main>
        
        <!-- View 1: Courses Main Grid -->
        <div id="view-courses">
            <div class="dashboard-header">
                <div>
                    <h2>Assigned Courses</h2>
                    <p style="color: var(--text-muted); font-size: 0.88rem;">Select a course block to manage its classes.</p>
                </div>
                <button class="primary-btn" onclick="addNewCourse()">+ Add Course</button>
            </div>
            <div id="courses-list-container" class="grid-container">
                <p style="color: var(--text-muted);">Loading courses...</p>
            </div>
        </div>

        <!-- View 2: Classes Grid -->
        <div id="view-classes" class="hidden">
            <div class="dashboard-header">
                <div>
                    <button class="secondary-btn" style="margin-bottom: 8px;" onclick="showCoursesView()">← Back to Courses</button>
                    <h2 id="current-course-title">Course Classes</h2>
                </div>
                <button class="primary-btn" onclick="addNewClassToCurrentCourse()">+ Add Class</button>
            </div>
            <div id="classes-list-container" class="grid-container">
                <p style="color: var(--text-muted);">Loading classes...</p>
            </div>
        </div>

        <!-- View 3: Class Roster Table -->
        <div id="view-class-details" class="hidden">
            <div class="dashboard-header">
                <div>
                    <button class="secondary-btn" style="margin-bottom: 8px;" onclick="showClassesView(currentCourseId, currentCourseName)">← Back to Classes</button>
                    <h2 id="current-class-title">Class Roster</h2>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="secondary-btn" onclick="exportClassToExcel()">📥 Download Excel</button>
                    <button class="primary-btn" onclick="addStudentToCurrentClass()">+ Add Student</button>
                </div>
            </div>

            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Student Name</th>
                            <th>Student CPR</th>
                            <th>Tamkeen Status</th>
                            <th>Comments</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="students-table-body">
                        <tr><td colspan="5" style="text-align: center; color: var(--text-muted);">Loading students...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <footer class="bottom-footer">
        <span id="footer-datetime">Loading date & time...</span>
    </footer>

    <!-- Firebase Script Initialization -->
    <script src="script.js"></script>

    <script>
        let currentCourseId = null;
        let currentCourseName = "";
        let currentClassId = null;
        let currentClassName = "";
        let currentStudentsData = [];

        function escapeHTML(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function updateDateTime() {
            const now = new Date();
            const footerEl = document.getElementById('footer-datetime');
            if (footerEl) footerEl.innerText = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        function toggleLanguage() {
            const isRTL = document.body.getAttribute('dir') === 'rtl';
            document.body.setAttribute('dir', isRTL ? 'ltr' : 'rtl');
            document.getElementById('lang-btn').innerText = isRTL ? 'EN / AR' : 'AR / EN';
        }

        function handleLogout() {
            if (typeof logoutUser === 'function') {
                logoutUser();
            } else if (window.auth) {
                window.auth.signOut().then(() => { window.location.href = "index.html"; });
            }
        }

        // Initialize Authentication & Load Courses
        document.addEventListener("DOMContentLoaded", () => {
            const authInstance = window.auth || (typeof firebase !== 'undefined' && firebase.auth());
            if (authInstance) {
                authInstance.onAuthStateChanged((user) => {
                    if (user) {
                        const emailDisplay = document.getElementById('operator-email-display');
                        if (emailDisplay) emailDisplay.innerText = user.email;
                        showCoursesView();
                    } else {
                        window.location.href = "index.html";
                    }
                });
            }
        });

        function showCoursesView() {
            document.getElementById('view-courses').classList.remove('hidden');
            document.getElementById('view-classes').classList.add('hidden');
            document.getElementById('view-class-details').classList.add('hidden');
            loadManagerCourses();
        }

        function showClassesView(courseId, courseName) {
            currentCourseId = courseId;
            currentCourseName = courseName;
            document.getElementById('current-course-title').innerText = `Course: ${courseName}`;
            document.getElementById('view-courses').classList.add('hidden');
            document.getElementById('view-classes').classList.remove('hidden');
            document.getElementById('view-class-details').classList.add('hidden');
            loadClassesForCourse(courseId);
        }

        function showClassDetailsView(classId, className) {
            currentClassId = classId;
            currentClassName = className;
            document.getElementById('current-class-title').innerText = `${currentCourseName} → ${className}`;
            document.getElementById('view-courses').classList.add('hidden');
            document.getElementById('view-classes').classList.add('hidden');
            document.getElementById('view-class-details').classList.remove('hidden');
            loadStudentsForClass(currentCourseId, classId);
        }

        // Fetch Courses into 3-column Grid
        function loadManagerCourses() {
            const dbInstance = window.db || (typeof firebase !== 'undefined' && firebase.firestore());
            if (!dbInstance) return;

            dbInstance.collection("courses").onSnapshot((snapshot) => {
                const container = document.getElementById("courses-list-container");
                container.innerHTML = "";

                if (snapshot.empty) {
                    container.innerHTML = "<p style='color: var(--text-muted); grid-column: 1 / -1;'>No courses found.</p>";
                    return;
                }

                snapshot.forEach((doc) => {
                    const course = doc.data();
                    const courseId = doc.id;
                    const cName = course.courseName || "Unnamed Course";

                    const card = document.createElement("div");
                    card.className = "square-card";
                    card.onclick = () => showClassesView(courseId, cName);

                    card.innerHTML = `
                        <div>
                            <h3>📚 ${escapeHTML(cName)}</h3>
                            <p>Click to open course classes</p>
                        </div>
                        <div style="margin-top: 15px; text-align: right;">
                            <span style="color: var(--accent-mint); font-size: 0.8rem; font-weight: 600;">Manage Classes →</span>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }, (err) => {
                console.error("Firestore error:", err);
            });
        }

        async function addNewCourse() {
            const dbInstance = window.db || (typeof firebase !== 'undefined' && firebase.firestore());
            const courseName = prompt("Enter New Course Name:");
            if (!courseName || !courseName.trim() || !dbInstance) return;

            try {
                await dbInstance.collection("courses").add({
                    courseName: courseName.trim(),
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch (err) {
                alert("Error adding course: " + err.message);
            }
        }

        // Fetch Classes into Grid
        function loadClassesForCourse(courseId) {
            const dbInstance = window.db || (typeof firebase !== 'undefined' && firebase.firestore());
            if (!dbInstance) return;

            dbInstance.collection("courses").doc(courseId).collection("classes").onSnapshot((snapshot) => {
                const container = document.getElementById("classes-list-container");
                container.innerHTML = "";

                if (snapshot.empty) {
                    container.innerHTML = "<p style='color: var(--text-muted); grid-column: 1 / -1;'>No classes created under this course yet.</p>";
                    return;
                }

                snapshot.forEach((classDoc) => {
                    const classData = classDoc.data();
                    const classId = classDoc.id;
                    const className = classData.className || "Unnamed Class";

                    const card = document.createElement("div");
                    card.className = "square-card";
                    card.onclick = () => showClassDetailsView(classId, className);

                    card.innerHTML = `
                        <div>
                            <h4>🏫 Class: ${escapeHTML(className)}</h4>
                            <p>View roster & manage enrolled students</p>
                        </div>
                        <div style="margin-top: 15px; text-align: right;">
                            <span style="color: var(--accent-blue); font-size: 0.8rem; font-weight: 600;">Open Roster →</span>
                        </div>
                    `;
                    container.appendChild(card);
                });
            });
        }

        async function addNewClassToCurrentCourse() {
            const dbInstance = window.db || (typeof firebase !== 'undefined' && firebase.firestore());
            if (!currentCourseId || !dbInstance) return;

            const className = prompt("Enter Class Name (e.g., Section 1, Batch A):");
            if (!className || !className.trim()) return;

            try {
                await dbInstance.collection("courses").doc(currentCourseId).collection("classes").add({
                    className: className.trim(),
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch (err) {
                alert("Error adding class: " + err.message);
            }
        }

        // Fetch Students
        function loadStudentsForClass(courseId, classId) {
            const dbInstance = window.db || (typeof firebase !== 'undefined' && firebase.firestore());
            if (!dbInstance) return;

            dbInstance.collection("courses").doc(courseId)
                .collection("classes").doc(classId)
                .collection("students").onSnapshot((snapshot) => {
                    const tbody = document.getElementById("students-table-body");
                    tbody.innerHTML = "";
                    currentStudentsData = [];

                    if (snapshot.empty) {
                        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">No students registered yet.</td></tr>`;
                        return;
                    }

                    snapshot.forEach((doc) => {
                        const student = doc.data();
                        const studentId = doc.id;
                        const sName = student.studentName || "N/A";
                        const cpr = student.cpr || studentId;
                        const status = student.tamkeenStatus || "Under Process";
                        const comment = student.comment || "";

                        currentStudentsData.push({ studentName: sName, cpr, tamkeenStatus: status, comment });

                        const row = document.createElement("tr");

                        const tdName = document.createElement("td");
                        tdName.textContent = sName;
                        row.appendChild(tdName);

                        const tdCpr = document.createElement("td");
                        tdCpr.textContent = cpr;
                        row.appendChild(tdCpr);

                        const tdStatus = document.createElement("td");
                        const selectStatus = document.createElement("select");
                        selectStatus.style.cssText = "padding: 4px 8px; border-radius: 6px; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid var(--border-color);";
                        selectStatus.onchange = (e) => updateStudentField(studentId, 'tamkeenStatus', e.target.value);
                        
                        ['Accepted', 'Under Process', 'Withdrawn'].forEach((optVal) => {
                            const opt = document.createElement("option");
                            opt.value = optVal;
                            opt.textContent = optVal;
                            opt.style.background = "#0f172a";
                            if (status === optVal) opt.selected = true;
                            selectStatus.appendChild(opt);
                        });
                        tdStatus.appendChild(selectStatus);
                        row.appendChild(tdStatus);

                        const tdComment = document.createElement("td");
                        tdComment.innerHTML = comment ? escapeHTML(comment) : '<i style="color:var(--text-muted);">No comments</i>';
                        const commentBtn = document.createElement("button");
                        commentBtn.className = "secondary-btn";
                        commentBtn.style.cssText = "padding: 2px 6px; font-size: 0.75rem; margin-left: 8px;";
                        commentBtn.innerText = "💬 Edit";
                        commentBtn.onclick = () => addComment(studentId, comment);
                        tdComment.appendChild(commentBtn);
                        row.appendChild(tdComment);

                        const tdAction = document.createElement("td");
                        const deleteBtn = document.createElement("button");
                        deleteBtn.className = "logout-btn";
                        deleteBtn.style.cssText = "padding: 4px 8px; font-size: 0.8rem; border-radius: 6px;";
                        deleteBtn.innerText = "🗑️ Delete";
                        deleteBtn.onclick = () => deleteStudent(studentId);
                        tdAction.appendChild(deleteBtn);
                        row.appendChild(tdAction);

                        tbody.appendChild(row);
                    });
                });
        }

        async function addStudentToCurrentClass() {
            const dbInstance = window.db || (typeof firebase !== 'undefined' && firebase.firestore());
            if (!dbInstance) return;

            const studentName = prompt("Enter Student Name:");
            if (!studentName || !studentName.trim()) return;

            const cpr = prompt("Enter 9-digit CPR:");
            if (!cpr || !/^\d{9}$/.test(cpr.trim())) {
                alert("Please enter a valid 9-digit CPR number.");
                return;
            }

            try {
                await dbInstance.collection("courses").doc(currentCourseId)
                    .collection("classes").doc(currentClassId)
                    .collection("students").doc(cpr.trim()).set({
                        studentName: studentName.trim(),
                        cpr: cpr.trim(),
                        tamkeenStatus: "Under Process",
                        comment: "",
                        addedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
            } catch (err) {
                alert("Failed to add student: " + err.message);
            }
        }

        async function updateStudentField(studentId, field, value) {
            const dbInstance = window.db || (typeof firebase !== 'undefined' && firebase.firestore());
            if (!dbInstance) return;

            try {
                await dbInstance.collection("courses").doc(currentCourseId)
                    .collection("classes").doc(currentClassId)
                    .collection("students").doc(studentId).update({ [field]: value });
            } catch (err) {
                alert("Failed to update: " + err.message);
            }
        }

        async function addComment(studentId, existingComment) {
            const newComment = prompt("Add/Update Comment:", existingComment || "");
            if (newComment === null) return;
            updateStudentField(studentId, 'comment', newComment.trim());
        }

        async function deleteStudent(studentId) {
            const dbInstance = window.db || (typeof firebase !== 'undefined' && firebase.firestore());
            if (!dbInstance || !confirm("Are you sure you want to delete this student record?")) return;

            try {
                await dbInstance.collection("courses").doc(currentCourseId)
                    .collection("classes").doc(currentClassId)
                    .collection("students").doc(studentId).delete();
            } catch (err) {
                alert("Failed to delete student: " + err.message);
            }
        }

        function exportClassToExcel() {
            if (!currentStudentsData || currentStudentsData.length === 0) {
                alert("No student data available to download.");
                return;
            }

            const worksheet = XLSX.utils.json_to_sheet(currentStudentsData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Students");
            const fileName = `${currentCourseName}_${currentClassName}_Students.xlsx`.replace(/\s+/g, '_');
            XLSX.writeFile(workbook, fileName);
        }
    </script>
</body>
</html>
