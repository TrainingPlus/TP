<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Student System</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="dot"></div>
    <h1>Student Management System</h1>
    <p>Sign in with your company Google account to continue.</p>
    <button class="google-btn" id="google-signin-btn">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.4C29.6 35.4 27 36.5 24 36.5c-5.2 0-9.6-3.3-11.3-8l-6.6 5.1C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.3-4.1 5.6l6.6 5.4C41.9 35.6 44 30.3 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
      Continue with Google
    </button>
    <p class="hint mt-16">By continuing you agree that your name, email and photo from Google will be stored to identify you inside the system.</p>
  </div>
</div>
<div id="toast-stack"></div>

<script type="module">
  import { signInWithGoogle } from "/js/auth.js";
  import { auth } from "/js/firebase-config.js";
  import { db } from "/js/firebase-config.js";
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { toast } from "/js/ui.js";

  // already signed in? route straight through
  onAuthStateChanged(auth, async (user) => {
    if (!user) return;
    const snap = await getDoc(doc(db, "users", user.uid));
    if (!snap.exists()) return;
    const p = snap.data();
    if (p.status !== "active") { window.location.href = "/pending.html"; return; }
    window.location.href = `/${p.role}/dashboard.html`;
  });

  document.getElementById("google-signin-btn").addEventListener("click", async () => {
    try {
      const user = await signInWithGoogle();
      const snap = await getDoc(doc(db, "users", user.uid));
      const p = snap.data();
      if (p.status !== "active") { window.location.href = "/pending.html"; return; }
      window.location.href = `/${p.role}/dashboard.html`;
    } catch (err) {
      console.error(err);
      toast("Sign-in failed: " + err.message, "error");
    }
  });
</script>
</body>
</html>
