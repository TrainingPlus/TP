<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class — Student System</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<div class="app-shell">
  <header id="app-header"></header>
  <main class="content">
    <div class="page-head">
      <div>
        <p class="muted" id="breadcrumb"><a href="/operator/courses.html">← Courses</a></p>
        <h1 id="class-title">Class</h1>
      </div>
      <div class="flex">
        <button class="btn" id="add-student-btn">+ Add student</button>
        <button class="btn btn-primary" id="export-btn" data-i18n="download_excel">Download Excel</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-body" style="padding:0;">
        <table class="data">
          <thead>
            <tr>
              <th data-i18n="name">Name</th>
              <th data-i18n="cpr">CPR</th>
              <th data-i18n="tamkeen_status">Tamkeen status</th>
              <th data-i18n="added_by">Sent by</th>
              <th data-i18n="comment">Comment</th>
            </tr>
          </thead>
          <tbody id="students-body"><tr class="empty-row"><td colspan="5">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
  <footer id="app-footer"></footer>
</div>
<div id="toast-stack"></div>

<div class="modal-backdrop" id="add-student-modal">
  <div class="modal">
    <div class="modal-head"><h3>Add student to class</h3></div>
    <div class="modal-body">
      <div class="field"><label data-i18n="name">Name</label><input type="text" id="s-name"></div>
      <div class="field"><label data-i18n="cpr">CPR</label><input type="text" id="s-cpr"></div>
      <div class="field"><label data-i18n="comment">Comment</label><input type="text" id="s-comment"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="cancel-student-btn" data-i18n="cancel">Cancel</button>
      <button class="btn btn-primary" id="confirm-student-btn" data-i18n="save">Save</button>
    </div>
  </div>
</div>

<script type="module">
import { guardPage } from "/js/auth.js";
import { db } from "/js/firebase-config.js";
import { renderHeader, renderFooter, toast } from "/js/ui.js";
import { initChat } from "/js/chat.js";
import { exportToExcel } from "/js/export.js";
import { t } from "/js/i18n.js";
import {
  doc, getDoc, setDoc, updateDoc, collection, addDoc, getDocs, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const params = new URLSearchParams(location.search);
const courseId = params.get("course");
const classId = params.get("class");
if (!courseId || !classId) window.location.href = "/operator/courses.html";
let className = "", courseName = "";

guardPage("operator", async (user, profile) => {
  renderHeader("operator", profile, "/operator/courses.html");
  renderFooter();
  initChat(profile, user.uid);

  const courseSnap = await getDoc(doc(db, "courses", courseId));
  const classSnap = await getDoc(doc(db, "courses", courseId, "classes", classId));
  courseName = courseSnap.data()?.name || "";
  className = classSnap.data()?.name || "Class";
  document.getElementById("class-title").textContent = className;
  document.getElementById("breadcrumb").innerHTML = `<a href="/operator/courses.html">Courses</a> / <a href="/operator/course.html?id=${courseId}">${courseName}</a>`;

  loadStudents();

  document.getElementById("add-student-btn").addEventListener("click", () => document.getElementById("add-student-modal").classList.add("open"));
  document.getElementById("cancel-student-btn").addEventListener("click", () => document.getElementById("add-student-modal").classList.remove("open"));
  document.getElementById("confirm-student-btn").addEventListener("click", async () => {
    const name = document.getElementById("s-name").value.trim();
    const cpr = document.getElementById("s-cpr").value.trim();
    const comment = document.getElementById("s-comment").value.trim();
    if (!name) return;
    await addDoc(collection(db, "courses", courseId, "classes", classId, "students"), {
      name, cpr, comment, tamkeenStatus: "processing",
      sentBy: user.uid, sentByName: profile.name, sentAt: serverTimestamp()
    });
    document.getElementById("add-student-modal").classList.remove("open");
    document.getElementById("s-name").value = ""; document.getElementById("s-cpr").value = ""; document.getElementById("s-comment").value = "";
    toast("Student added to class.", "success");
    loadStudents();
  });

  document.getElementById("export-btn").addEventListener("click", async () => {
    const snap = await getDocs(collection(db, "courses", courseId, "classes", classId, "students"));
    const rows = [];
    snap.forEach(d => {
      const s = d.data();
      rows.push({ Name: s.name || "", CPR: s.cpr || "", "Tamkeen Status": s.tamkeenStatus || "", "Sent By": s.sentByName || "", Comment: s.comment || "" });
    });
    exportToExcel(rows, `${className}.xlsx`, className.slice(0, 28));
  });
});

async function loadStudents(){
  const tbody = document.getElementById("students-body");
  const snap = await getDocs(collection(db, "courses", courseId, "classes", classId, "students"));
  if (snap.empty){ tbody.innerHTML = `<tr class="empty-row"><td colspan="5">No students in this class yet.</td></tr>`; return; }
  tbody.innerHTML = "";
  snap.forEach(d => {
    const s = d.data();
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${s.name || ""}</td>
      <td>${s.cpr || "-"}</td>
      <td>
        <select data-id="${d.id}" class="status-select">
          <option value="processing" ${s.tamkeenStatus === "processing" ? "selected" : ""}>${t("status_processing")}</option>
          <option value="accepted" ${s.tamkeenStatus === "accepted" ? "selected" : ""}>${t("status_accepted")}</option>
          <option value="withdrawn" ${s.tamkeenStatus === "withdrawn" ? "selected" : ""}>${t("status_withdrawn")}</option>
        </select>
      </td>
      <td>${s.sentByName || "-"}</td>
      <td>${s.comment || "-"}</td>`;
    tbody.appendChild(tr);
  });
  tbody.querySelectorAll(".status-select").forEach(sel => {
    sel.addEventListener("click", (e) => e.stopPropagation());
    sel.addEventListener("change", async () => {
      await updateDoc(doc(db, "courses", courseId, "classes", classId, "students", sel.dataset.id), { tamkeenStatus: sel.value });
      toast("Status updated.", "success");
    });
  });
}
</script>
</body>
</html>
