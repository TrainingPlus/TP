<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Sign-In | Portal</title>
  <style>
    :root {
      --bg-color: #f2f7f5;
      --card-bg: #ffffff;
      --text-primary: #2d3748;
      --text-muted: #718096;
      --border-color: #e2e8f0;
      --accent-mint: #a8e6cf;
      --accent-mint-dark: #81c784;
      --accent-slate-blue: #709fb0;
      --danger-red: #e57373;
      --valid-green: #38a169;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Top Nav */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--accent-slate-blue);
      padding: 12px 24px;
      color: white;
    }

    .nav-btn {
      background-color: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 7px 14px;
      border-radius: 18px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .nav-btn:hover { background-color: rgba(255, 255, 255, 0.35); }

    /* Login Card */
    .login-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card-view {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      padding: 32px;
      border-radius: 16px;
      border: 1px solid #e8f0ec;
      box-shadow: 0 8px 20px rgba(0,0,0,0.04);
    }

    .card-title {
      text-align: center;
      margin-bottom: 24px;
      color: var(--text-primary);
    }

    .role-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .role-btn {
      padding: 14px;
      border-radius: 10px;
      border: 1.5px solid var(--border-color);
      background-color: #f8faf9;
      color: var(--text-primary);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .role-btn:hover {
      border-color: var(--accent-slate-blue);
      background-color: #f0f7f9;
    }

    .role-btn.selected {
      background-color: var(--accent-slate-blue);
      color: white;
      border-color: var(--accent-slate-blue);
    }

    /* Form Styles */
    .standard-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .standard-form label {
      display: flex;
      flex-direction: column;
      font-size: 0.88rem;
      gap: 6px;
    }

    .standard-form input {
      padding: 10px 12px;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      outline: none;
    }

    .primary-btn {
      background-color: var(--accent-mint);
      color: #2c5244;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      margin-top: 8px;
    }

    .primary-btn:hover {
      background-color: var(--accent-mint-dark);
      color: white;
    }

    .alert-banner {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      display: none;
    }

    .alert-banner.error {
      background-color: #fde8e8;
      color: var(--danger-red);
      border: 1px solid #f8b4b4;
    }

    .bottom-footer {
      background-color: #1a202c;
      color: #a0aec0;
      text-align: center;
      padding: 12px;
      font-size: 0.82rem;
    }

    body[dir="rtl"] { direction: rtl; text-align: right; }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <nav class="top-nav">
    <div style="font-weight:700; font-size:1.1rem;">Enterprise Portal</div>
    <button class="nav-btn" onclick="toggleLanguage()">EN / AR</button>
  </nav>

  <!-- Login Main Section -->
  <div class="login-wrapper">
    <div class="card-view">
      <h2 class="card-title" id="page-title">Sign In to System</h2>

      <div id="alert-box" class="alert-banner error"></div>

      <!-- Step 1: Select Role -->
      <label style="font-size: 0.88rem; margin-bottom: 8px; display: block; font-weight: 600;">Select Your Access Level:</label>
      <div class="role-buttons">
        <div class="role-btn" onclick="chooseRole('manager', this)" id="btn-manager">1. Manager</div>
        <div class="role-btn" onclick="chooseRole('operator', this)" id="btn-operator">2. Operator</div>
        <div class="role-btn" onclick="chooseRole('employee', this)" id="btn-employee">3. Employee</div>
      </div>

      <!-- Step 2: Sign-In Form -->
      <form class="standard-form" onsubmit="handleSignIn(event)">
        <label>Username
          <input type="text" id="username" placeholder="Enter username" required>
        </label>
        <label>Password
          <input type="password" id="password" placeholder="Enter password" required>
        </label>
        <button type="submit" class="primary-btn">Sign In</button>
      </form>
    </div>
  </div>

  <!-- Bottom Footer -->
  <div class="bottom-footer">
    © 2026 Management System Portal. All Rights Reserved.
  </div>

  <script>
    let selectedRole = null;

    function chooseRole(role, element) {
      selectedRole = role;
      document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('selected'));
      element.classList.add('selected');
      hideError();
    }

    function showError(message) {
      const alertBox = document.getElementById('alert-box');
      alertBox.textContent = message;
      alertBox.style.display = 'block';
    }

    function hideError() {
      document.getElementById('alert-box').style.display = 'none';
    }

    function handleSignIn(event) {
      event.preventDefault();
      
      if (!selectedRole) {
        showError("Please select a role (Manager, Operator, or Employee) before signing in.");
        return;
      }

      const username = document.getElementById('username').value.trim();

      // Check 1: Manager Single-Session Security Check
      if (selectedRole === 'manager') {
        const isManagerActive = localStorage.getItem('active_manager_session');
        if (isManagerActive === 'true') {
          showError("You are not the manager. Only one active manager session is allowed.");
          return;
        }
        localStorage.setItem('active_manager_session', 'true');
      }

      // Check 2: Operator Single-Session Security Check
      if (selectedRole === 'operator') {
        const isOperatorActive = localStorage.getItem('active_operator_session');
        if (isOperatorActive === 'true') {
          showError("You are not an operator. An operator is already signed in.");
          return;
        }
        localStorage.setItem('active_operator_session', 'true');
      }

      // Check 3: Employee Approval Flow Notification
      if (selectedRole === 'employee') {
        // Trigger simulated manager email alert
        console.log(`[Email Triggered] To: Manager | Body: Employee "${username}" attempted to sign in. Pending approval.`);
        alert("Sign-in request sent! An email message reached the manager. You cannot use the system until the manager accepts you.");
      }

      // Store user session state in localStorage and redirect
      localStorage.setItem('current_user_name', username);
      localStorage.setItem('current_user_role', selectedRole);

      // Redirect to main system dashboard html
      window.location.href = "dashboard.html";
    }

    function toggleLanguage() {
      const currentDir = document.body.getAttribute('dir');
      if (currentDir === 'rtl') {
        document.body.setAttribute('dir', 'ltr');
      } else {
        document.body.setAttribute('dir', 'rtl');
      }
    }
  </script>
</body>
</html>
