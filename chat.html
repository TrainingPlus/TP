<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat Widget</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mustard: {
              50: '#fffbeb',
              100: '#fef3c7',
              200: '#fde68a',
              300: '#fcd34d',
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706', /* Core Mustard Accent */
              700: '#b45309',
              800: '#92400e',
              900: '#78350f',
            }
          }
        }
      }
    }
  </script>
  <style>
    .chat-shadow {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #CBD5E1;
      border-radius: 3px;
    }
  </style>
</head>
<body class="bg-gray-100 font-sans antialiased">

  <button id="chatToggleBtn" onclick="toggleChatWindow()" class="fixed bottom-6 right-6 w-14 h-14 bg-mustard-600 hover:bg-mustard-700 text-white rounded-full flex items-center justify-center chat-shadow transition-all duration-300 transform hover:scale-105 z-50 focus:outline-none">
    <i id="toggleIcon" class="fas fa-comments text-2xl"></i>
  </button>

  <div id="chatWindow" class="hidden fixed bottom-24 right-6 w-96 h-[560px] bg-white rounded-2xl chat-shadow flex-col overflow-hidden border border-gray-200 z-50">
    
    <div class="bg-mustard-600 text-white p-4 flex items-center justify-between shadow-md">
      <div class="flex items-center space-x-3">
        <button id="backBtn" onclick="showView('users')" class="hidden hover:bg-mustard-700 p-1.5 rounded-full transition-colors focus:outline-none" title="Back to User List">
          <i class="fas fa-arrow-left text-base"></i>
        </button>
        <div>
          <h3 id="chatTitle" class="font-semibold text-lg leading-tight">Messages</h3>
          <p id="chatSubtitle" class="text-xs text-amber-100">Select a contact or start a group</p>
        </div>
      </div>
      <button onclick="toggleChatWindow()" class="hover:bg-mustard-700 p-1.5 rounded-full transition-colors">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <div id="usersView" class="flex-1 flex flex-col bg-slate-50 overflow-hidden">
      <div class="px-4 pt-3 pb-1 flex items-center justify-between text-xs font-bold text-gray-500 uppercase tracking-wider">
        <span>System Users</span>
        <button onclick="showView('createGroup')" class="text-mustard-600 hover:text-mustard-800 normal-case font-semibold flex items-center space-x-1">
          <i class="fas fa-plus-circle"></i>
          <span>New Group</span>
        </button>
      </div>

      <div id="usersList" class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-2">
        </div>
    </div>

    <div id="createGroupView" class="hidden flex-1 flex-col bg-slate-50 overflow-hidden p-4">
      <label class="block text-xs font-semibold text-gray-600 mb-1">GROUP NAME</label>
      <input type="text" id="groupNameInput" placeholder="Enter group name..." class="w-full px-3 py-2 border rounded-lg mb-4 text-sm focus:outline-none focus:ring-2 focus:ring-mustard-500">
      
      <label class="block text-xs font-semibold text-gray-600 mb-2">SELECT MEMBERS</label>
      <div id="groupMembersList" class="flex-1 overflow-y-auto custom-scrollbar space-y-2 bg-white p-2 rounded-lg border border-gray-200 mb-4">
        </div>

      <button onclick="confirmCreateGroup()" class="w-full bg-mustard-600 hover:bg-mustard-700 text-white py-2 rounded-lg text-sm font-semibold transition-colors">
        Create Group Chat
      </button>
    </div>

    <div id="chatConversationView" class="hidden flex-1 flex-col bg-gray-50 overflow-hidden">
      <div id="messagesContainer" class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-3">
        </div>

      <div id="emojiPicker" class="hidden bg-white border-t border-gray-200 p-2 grid grid-cols-6 gap-2 text-center text-xl max-h-32 overflow-y-auto custom-scrollbar">
        <span class="cursor-pointer hover:bg-gray-100 rounded" onclick="insertEmoji('😀')">😀</span>
        <span class="cursor-pointer hover:bg-gray-100 rounded" onclick="insertEmoji('😂')">😂</span>
        <span class="cursor-pointer hover:bg-gray-100 rounded" onclick="insertEmoji('😍')">😍</span>
        <span class="cursor-pointer hover:bg-gray-100 rounded" onclick="insertEmoji('👍')">👍</span>
        <span class="cursor-pointer hover:bg-gray-100 rounded" onclick="insertEmoji('🔥')">🔥</span>
        <span class="cursor-pointer hover:bg-gray-100 rounded" onclick="insertEmoji('🎉')">🎉</span>
        <span class="cursor-pointer hover:bg-gray-100 rounded" onclick="insertEmoji('❤️')">❤️</span>
        <span class="cursor-pointer hover:bg-gray-100 rounded" onclick="insertEmoji('🙌')">🙌</span>
        <span class="cursor-pointer hover:bg-gray-100 rounded" onclick="insertEmoji('😎')">😎</span>
        <span class="cursor-pointer hover:bg-gray-100 rounded" onclick="insertEmoji('🤔')">🤔</span>
        <span class="cursor-pointer hover:bg-gray-100 rounded" onclick="insertEmoji('👏')">👏</span>
        <span class="cursor-pointer hover:bg-gray-100 rounded" onclick="insertEmoji('✨')">✨</span>
      </div>

      <div class="p-3 bg-white border-t border-gray-200 flex items-center space-x-2">
        <input type="file" id="fileInput" class="hidden" accept=".pdf,.doc,.docx,.ppt,.pptx,.png,.jpg,.jpeg" onchange="handleFileUpload(event)">
        <button onclick="document.getElementById('fileInput').click()" class="text-gray-500 hover:text-mustard-600 p-1.5 rounded-full transition-colors" title="Attach Document or Image">
          <i class="fas fa-paperclip text-lg"></i>
        </button>

        <button onclick="toggleEmojiPicker()" class="text-gray-500 hover:text-mustard-600 p-1.5 rounded-full transition-colors" title="Add Emoji">
          <i class="far fa-smile text-lg"></i>
        </button>

        <input type="text" id="messageInput" placeholder="Type a message..." class="flex-1 text-sm bg-gray-100 px-3 py-2 rounded-full focus:outline-none focus:ring-2 focus:ring-mustard-500" onkeydown="handleKeyPress(event)">

        <button onclick="sendTextMessage()" class="bg-mustard-600 hover:bg-mustard-700 text-white p-2 w-9 h-9 rounded-full flex items-center justify-center transition-colors shadow">
          <i class="fas fa-paper-plane text-xs"></i>
        </button>
      </div>
    </div>

  </div>

  <script>
    // State Management
    const currentUser = { id: 0, name: 'You' };
    
    const systemUsers = [
      { id: 1, name: 'Alex Johnson', avatar: 'https://i.pravatar.cc/150?img=11', status: 'Online' },
      { id: 2, name: 'Sarah Connor', avatar: 'https://i.pravatar.cc/150?img=5', status: 'Offline' },
      { id: 3, name: 'Michael Scott', avatar: 'https://i.pravatar.cc/150?img=13', status: 'Online' },
      { id: 4, name: 'Emma Watson', avatar: 'https://i.pravatar.cc/150?img=9', status: 'Online' }
    ];

    let activeChatId = null; // Target User ID or Group ID
    let activeChatType = 'private'; // 'private' or 'group'
    
    // Message store using ID keys
    const chatData = {
      // Dynamic keys: e.g. 'private-1', 'group-101'
    };

    // Toggle Chat Panel
    function toggleChatWindow() {
      const chatWindow = document.getElementById('chatWindow');
      const icon = document.getElementById('toggleIcon');
      
      if (chatWindow.classList.contains('hidden')) {
        chatWindow.classList.remove('hidden');
        chatWindow.classList.add('flex');
        icon.classList.replace('fa-comments', 'fa-chevron-down');
        showView('users');
      } else {
        chatWindow.classList.add('hidden');
        chatWindow.classList.remove('flex');
        icon.classList.replace('fa-chevron-down', 'fa-comments');
      }
    }

    // View Navigation
    function showView(viewName) {
      const usersView = document.getElementById('usersView');
      const createGroupView = document.getElementById('createGroupView');
      const chatConversationView = document.getElementById('chatConversationView');
      const backBtn = document.getElementById('backBtn');
      const title = document.getElementById('chatTitle');
      const subtitle = document.getElementById('chatSubtitle');

      // Hide all views first
      usersView.classList.add('hidden');
      createGroupView.classList.add('hidden');
      chatConversationView.classList.add('hidden');
      document.getElementById('emojiPicker').classList.add('hidden');

      if (viewName === 'users') {
        usersView.classList.remove('hidden');
        backBtn.classList.add('hidden'); // Hide back arrow on home user list
        title.innerText = 'Messages';
        subtitle.innerText = 'Select a contact or start a group';
        renderUsersList();
      } else if (viewName === 'createGroup') {
        createGroupView.classList.remove('hidden');
        createGroupView.classList.add('flex');
        backBtn.classList.remove('hidden'); // Show back arrow
        title.innerText = 'New Group';
        subtitle.innerText = 'Select members to add';
        renderGroupCreationList();
      } else if (viewName === 'conversation') {
        chatConversationView.classList.remove('hidden');
        chatConversationView.classList.add('flex');
        backBtn.classList.remove('hidden'); // Show back arrow to allow changing users
        renderMessages();
      }
    }

    // Render list of system users
    function renderUsersList() {
      const container = document.getElementById('usersList');
      container.innerHTML = '';

      systemUsers.forEach(user => {
        const div = document.createElement('div');
        div.className = 'flex items-center p-2.5 hover:bg-white rounded-xl cursor-pointer transition-all border border-transparent hover:border-gray-200 shadow-sm';
        div.onclick = () => openPrivateChat(user);
        
        div.innerHTML = `
          <div class="relative mr-3">
            <img src="${user.avatar}" class="w-10 h-10 rounded-full object-cover">
            <span class="w-3 h-3 ${user.status === 'Online' ? 'bg-green-500' : 'bg-gray-400'} border-2 border-white rounded-full absolute bottom-0 right-0"></span>
          </div>
          <div class="flex-1">
            <div class="font-medium text-gray-800 text-sm">${user.name}</div>
            <div class="text-xs text-gray-500">${user.status}</div>
          </div>
          <i class="fas fa-chevron-right text-gray-300 text-xs"></i>
        `;
        container.appendChild(div);
      });
    }

    // Open Private Chat
    function openPrivateChat(user) {
      activeChatId = user.id;
      activeChatType = 'private';
      
      document.getElementById('chatTitle').innerText = user.name;
      document.getElementById('chatSubtitle').innerText = user.status;
      
      showView('conversation');
    }

    // Render Group Creation List
    function renderGroupCreationList() {
      const container = document.getElementById('groupMembersList');
      container.innerHTML = '';

      systemUsers.forEach(user => {
        const label = document.createElement('label');
        label.className = 'flex items-center justify-between p-2 hover:bg-gray-50 rounded cursor-pointer';
        label.innerHTML = `
          <div class="flex items-center space-x-3">
            <img src="${user.avatar}" class="w-8 h-8 rounded-full">
            <span class="text-sm font-medium text-gray-700">${user.name}</span>
          </div>
          <input type="checkbox" value="${user.id}" class="group-member-checkbox rounded text-mustard-600 focus:ring-mustard-500 w-4 h-4">
        `;
        container.appendChild(label);
      });
    }

    // Confirm Group Creation
    function confirmCreateGroup() {
      const groupName = document.getElementById('groupNameInput').value.trim();
      const checkboxes = document.querySelectorAll('.group-member-checkbox:checked');
      
      if (!groupName) {
        alert('Please enter a group name');
        return;
      }
      if (checkboxes.length === 0) {
        alert('Please select at least one user');
        return;
      }

      const selectedIds = Array.from(checkboxes).map(cb => parseInt(cb.value));
      const groupId = Date.now();
      
      activeChatId = groupId;
      activeChatType = 'group';
      
      document.getElementById('chatTitle').innerText = groupName;
      document.getElementById('chatSubtitle').innerText = `${selectedIds.length + 1} members`;

      document.getElementById('groupNameInput').value = '';
      showView('conversation');
    }

    // Messages Functions
    function getChatKey() {
      return `${activeChatType}-${activeChatId}`;
    }

    function renderMessages() {
      const key = getChatKey();
      const container = document.getElementById('messagesContainer');
      container.innerHTML = '';

      if (!chatData[key]) {
        chatData[key] = [];
      }

      chatData[key].forEach(msg => {
        const isSelf = msg.senderId === currentUser.id;
        const msgDiv = document.createElement('div');
        msgDiv.className = `flex flex-col ${isSelf ? 'items-end' : 'items-start'}`;

        let contentHtml = '';

        if (msg.type === 'text') {
          contentHtml = `<p class="text-sm">${msg.content}</p>`;
        } else if (msg.type === 'file') {
          if (msg.fileType.startsWith('image/')) {
            contentHtml = `
              <div class="space-y-1">
                <img src="${msg.fileUrl}" class="max-w-[200px] rounded-lg mb-1 border">
                <a href="${msg.fileUrl}" download="${msg.fileName}" class="text-xs ${isSelf ? 'text-amber-100 hover:text-white' : 'text-mustard-700 hover:underline'} font-semibold flex items-center space-x-1">
                  <i class="fas fa-download"></i> <span>Download Image</span>
                </a>
              </div>
            `;
          } else {
            let iconClass = 'fa-file-alt';
            if (msg.fileName.includes('.pdf')) iconClass = 'fa-file-pdf text-red-500';
            if (msg.fileName.includes('.doc')) iconClass = 'fa-file-word text-blue-500';
            if (msg.fileName.includes('.ppt')) iconClass = 'fa-file-powerpoint text-orange-500';

            contentHtml = `
              <div class="flex items-center space-x-3 bg-white p-2 rounded-lg border border-gray-200 text-gray-800">
                <i class="fas ${iconClass} text-2xl"></i>
                <div class="flex-1 overflow-hidden">
                  <p class="text-xs font-semibold truncate max-w-[120px]">${msg.fileName}</p>
                  <a href="${msg.fileUrl}" download="${msg.fileName}" class="text-[10px] text-mustard-600 hover:underline flex items-center space-x-1 mt-0.5">
                    <i class="fas fa-download"></i> <span>Download</span>
                  </a>
                </div>
              </div>
            `;
          }
        }

        msgDiv.innerHTML = `
          <div class="max-w-[80%] rounded-2xl px-4 py-2 ${isSelf ? 'bg-mustard-600 text-white rounded-br-none' : 'bg-white text-gray-800 border border-gray-200 rounded-bl-none'} shadow-sm">
            ${contentHtml}
          </div>
          <span class="text-[10px] text-gray-400 mt-1 px-1">${msg.time}</span>
        `;
        container.appendChild(msgDiv);
      });

      container.scrollTop = container.scrollHeight;
    }

    function sendTextMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      const key = getChatKey();
      if (!chatData[key]) chatData[key] = [];

      chatData[key].push({
        senderId: currentUser.id,
        type: 'text',
        content: text,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });

      input.value = '';
      renderMessages();
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        sendTextMessage();
      }
    }

    // Emoji handling
    function toggleEmojiPicker() {
      const picker = document.getElementById('emojiPicker');
      picker.classList.toggle('hidden');
    }

    function insertEmoji(emoji) {
      const input = document.getElementById('messageInput');
      input.value += emoji;
      input.focus();
    }

    // File Upload Handling
    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const key = getChatKey();
        if (!chatData[key]) chatData[key] = [];

        chatData[key].push({
          senderId: currentUser.id,
          type: 'file',
          fileName: file.name,
          fileType: file.type,
          fileUrl: e.target.result,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });

        renderMessages();
      };

      reader.readAsDataURL(file);
      event.target.value = ''; // Reset input
    }
  </script>
</body>
</html>
