<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Portal | Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="top-nav">
        <div class="nav-left">
            <span style="font-weight:700; font-size:1.1rem;">Company System</span>
        </div>
        <div class="nav-controls">
            <button class="nav-btn" onclick="toggleLanguage()">EN / AR</button>
        </div>
    </nav>

    <div class="card-view" style="max-width: 450px;">
        <h2 style="text-align:center; margin-bottom: 20px;">System Login</h2>

        <div id="alert-box" class="alert-banner error"></div>

        <label style="font-size: 0.88rem; margin-bottom: 8px; display: block; font-weight: 600;">Select Role:</label>
        <div class="role-buttons">
            <div class="role-btn" onclick="selectRole('manager', this)">Manager</div>
            <div class="role-btn" onclick="selectRole('operator', this)">Operator</div>
            <div class="role-btn" onclick="selectRole('employee', this)">Employee</div>
        </div>

        <form class="standard-form" onsubmit="handleSignIn(event)">
            <label>Username
                <input type="text" id="username" placeholder="Enter username" required>
            </label>
            <label>Password
                <input type="password" id="password" placeholder="Enter password" required>
            </label>
            <button type="submit" class="primary-btn" style="margin-top:10px;">Sign In</button>
        </form>
    </div>

    <div class="bottom-footer">© 2026 Management System Portal.</div>

    <script src="script.js"></script>
    <script>
        let chosenRole = null;

        function selectRole(role, element) {
            chosenRole = role;
            document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('selected'));
            element.classList.add('selected');
            document.getElementById('alert-box').style.display = 'none';
        }

        function handleSignIn(event) {
            event.preventDefault();
            const alertBox = document.getElementById('alert-box');

            if (!chosenRole) {
                alertBox.textContent = "Please select a role before signing in.";
                alertBox.style.display = 'block';
                return;
            }

            const username = document.getElementById('username').value.trim();

            // 1. Manager Single-Account Constraint
            if (chosenRole === 'manager') {
                if (localStorage.getItem('active_manager_session') === 'true') {
                    alertBox.textContent = "You are not the manager. Only one manager can sign in.";
                    alertBox.style.display = 'block';
                    return;
                }
                localStorage.setItem('active_manager_session', 'true');
            }

            // 2. Operator Single-Account Constraint
            if (chosenRole === 'operator') {
                if (localStorage.getItem('active_operator_session') === 'true') {
                    alertBox.textContent = "You are not an operator. Only one operator can sign in.";
                    alertBox.style.display = 'block';
                    return;
                }
                localStorage.setItem('active_operator_session', 'true');
            }

            // 3. Employee Approval Notification Rule
            if (chosenRole === 'employee') {
                sendEmailNotification("Manager", `Employee ${username} attempted sign-in. Pending acceptance.`);
                alert("Sign-in email sent to Manager. You cannot use the system until accepted.");
            }

            // Save Session
            localStorage.setItem('current_user_name', username);
            localStorage.setItem('current_user_role', chosenRole);

            // Redirect to appropriate separate file
            window.location.href = `${chosenRole}.html`;
        }
    </script>
</body>
</html>
