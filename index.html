<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Portal | Sign In</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase SDKs (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>

    <nav class="top-nav">
        <div class="nav-left">
            <span style="font-weight:700; font-size:1.1rem;">Company System</span>
        </div>
        <div class="nav-controls">
            <button class="nav-btn" onclick="toggleLanguage()">EN / AR</button>
        </div>
    </nav>

    <div class="card-view" style="max-width: 450px;">
        <h2 style="text-align:center; margin-bottom: 20px;">System Login</h2>

        <div id="alert-box" class="alert-banner error" style="display:none;"></div>

        <label style="font-size: 0.88rem; margin-bottom: 8px; display: block; font-weight: 600;">Select Role:</label>
        <div class="role-buttons">
            <div class="role-btn" onclick="selectRole('manager', this)">Manager</div>
            <div class="role-btn" onclick="selectRole('operator', this)">Operator</div>
            <div class="role-btn" onclick="selectRole('employee', this)">Employee</div>
        </div>

        <!-- Username/Password Form for Manager & Operator -->
        <form id="credentials-form" class="standard-form" onsubmit="handleSignIn(event)">
            <label>Username
                <input type="text" id="username" placeholder="Enter username">
            </label>
            <label>Password
                <input type="password" id="password" placeholder="Enter password">
            </label>
            <button type="submit" class="primary-btn" style="margin-top:10px;">Sign In</button>
        </form>

        <!-- Google Sign-In Button (Only for Employee) -->
        <div id="google-auth-section" style="display: none; margin-top: 15px; text-align: center;">
            <button type="button" class="primary-btn" onclick="signInWithGoogleEmployee()" style="display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="Google">
                Sign in with Google
            </button>
        </div>
    </div>

    <div class="bottom-footer">© 2026 Management System Portal.</div>

    <script src="script.js"></script>
    <script>
        let chosenRole = null;

        function selectRole(role, element) {
            chosenRole = role;
            document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('selected'));
            element.classList.add('selected');
            document.getElementById('alert-box').style.display = 'none';

            const credentialsForm = document.getElementById('credentials-form');
            const googleSection = document.getElementById('google-auth-section');

            // Toggle between Credentials and Google Sign-In
            if (role === 'employee') {
                credentialsForm.style.display = 'none';
                googleSection.style.display = 'block';
            } else {
                credentialsForm.style.display = 'block';
                googleSection.style.display = 'none';
            }
        }

        // Handle Manager & Operator Credentials Login
        function handleSignIn(event) {
            event.preventDefault();
            const alertBox = document.getElementById('alert-box');

            if (!chosenRole) {
                alertBox.textContent = "Please select a role before signing in.";
                alertBox.style.display = 'block';
                return;
            }

            const username = document.getElementById('username').value.trim();

            if (chosenRole === 'manager') {
                if (localStorage.getItem('active_manager_session') === 'true') {
                    alertBox.textContent = "You are not the manager. Only one manager can sign in.";
                    alertBox.style.display = 'block';
                    return;
                }
                localStorage.setItem('active_manager_session', 'true');
            }

            if (chosenRole === 'operator') {
                if (localStorage.getItem('active_operator_session') === 'true') {
                    alertBox.textContent = "You are not an operator. Only one operator can sign in.";
                    alertBox.style.display = 'block';
                    return;
                }
                localStorage.setItem('active_operator_session', 'true');
            }

            localStorage.setItem('current_user_name', username);
            localStorage.setItem('current_user_role', chosenRole);

            window.location.href = `${chosenRole}.html`;
        }

        // Handle Employee Google Popup Login via Firebase
        function signInWithGoogleEmployee() {
            const provider = new firebase.auth.GoogleAuthProvider();

            auth.signInWithPopup(provider)
                .then((result) => {
                    const user = result.user;

                    // Save session details
                    localStorage.setItem('current_user_name', user.displayName || user.email.split('@')[0]);
                    localStorage.setItem('current_user_role', 'employee');

                    // Store user data in Firestore
                    return db.collection('users').doc(user.uid).set({
                        uid: user.uid,
                        email: user.email,
                        displayName: user.displayName,
                        role: 'employee',
                        lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });
                })
                .then(() => {
                    window.location.href = 'employee.html';
                })
                .catch((error) => {
                    const alertBox = document.getElementById('alert-box');
                    alertBox.textContent = "Google Sign-In Failed: " + error.message;
                    alertBox.style.display = 'block';
                });
        }
    </script>
</body>
</html>
