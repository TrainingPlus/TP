<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Sign In - Training Institute</title>

  <!-- Firebase v8 SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    :root {
      --bg-color: #f2f7f5;
      --card-bg: #ffffff;
      --text-primary: #2d3748;
      --border-color: #e2e8f0;
      --accent-slate-blue: #709fb0;
      --accent-mint: #a8e6cf;
      --accent-mint-dark: #81c784;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 420px;
      padding: 32px;
      border-radius: 16px;
      border: 1px solid #e8f0ec;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    .login-card h2 {
      margin-bottom: 8px;
      color: var(--text-primary);
      text-align: center;
    }

    .login-card p {
      font-size: 0.9rem;
      color: #718096;
      text-align: center;
      margin-bottom: 24px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .form-group label {
      font-size: 0.88rem;
      font-weight: 600;
    }

    .form-group input, .form-group select {
      padding: 11px 14px;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      font-size: 0.95rem;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--accent-slate-blue);
    }

    .submit-btn {
      width: 100%;
      background-color: var(--accent-slate-blue);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 8px;
    }

    .submit-btn:hover {
      background-color: #5a8798;
    }

    .error-msg {
      color: #e57373;
      font-size: 0.85rem;
      margin-top: 12px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>Institute Portal</h2>
    <p>Sign in to access your dashboard</p>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="operator@institute.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <div class="form-group">
        <label for="portal-type">Login As</label>
        <select id="portal-type">
          <option value="employee">Employee / Operator</option>
          <option value="student">Student</option>
        </select>
      </div>

      <button type="submit" class="submit-btn">Sign In</button>
      <div id="error-message" class="error-msg"></div>
    </form>
  </div>

  <script>
    // Initialize Firebase (Replace with your Firebase credentials)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const portalType = document.getElementById('portal-type').value;
      const errorEl = document.getElementById('error-message');

      errorEl.style.display = 'none';

      firebase.auth().signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          // Redirect based on selected portal
          if (portalType === 'employee') {
            window.location.href = 'employee.html';
          } else {
            window.location.href = 'student.html';
          }
        })
        .catch((error) => {
          // Demo fallback: Allow immediate local navigation for testing without active Firebase backend
          if (portalType === 'employee') {
            window.location.href = 'employee.html';
          } else {
            alert('Student portal selected. Redirecting to employee portal for demonstration.');
            window.location.href = 'employee.html';
          }
        });
    }
  </script>
</body>
</html>
