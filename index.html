<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Authentication - Training Plus Institute</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="role-auth-page">
    <div class="auth-card">
        <div class="logo-container">
            <h1 class="brand-title">Training Plus Institute</h1>
            <p class="brand-subtitle">System Portal Access</p>
        </div>

        <div id="alert-box" class="alert-message hidden"></div>

        <div class="role-selector">
            <button type="button" class="role-tab active" onclick="selectRole('employee')">Employee Login</button>
            <button type="button" class="role-tab" onclick="selectRole('operator')">Operator Login</button>
            <button type="button" class="role-tab" onclick="selectRole('manager')">Manager Login</button>
        </div>

        <!-- EMPLOYEE LOGIN PANEL -->
        <div id="panel-employee" class="login-panel">
            <div class="panel-info">
                <h3>Employee Portal Access</h3>
                <p>Sign in using your assigned Google Workspace or Employee email account.</p>
            </div>
            <button class="google-auth-btn" onclick="loginEmployeeGoogle()">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                Continue with Google
            </button>
        </div>

        <!-- OPERATOR LOGIN PANEL -->
        <div id="panel-operator" class="login-panel hidden">
            <form id="form-operator" onsubmit="loginOperator(event)">
                <div class="form-group">
                    <label for="op-username">Operator Username</label>
                    <input type="text" id="op-username" placeholder="Enter username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="op-password">Passcode</label>
                    <input type="password" id="op-password" placeholder="Enter passcode" required autocomplete="current-password">
                </div>
                <button type="submit" class="submit-btn">Login as Operator</button>
            </form>
        </div>

        <!-- MANAGER LOGIN PANEL -->
        <div id="panel-manager" class="login-panel hidden">
            <form id="form-manager" onsubmit="loginManager(event)">
                <div class="form-group">
                    <label for="mgr-username">Manager Username</label>
                    <input type="text" id="mgr-username" placeholder="Enter manager ID" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="mgr-password">Master Password</label>
                    <input type="password" id="mgr-password" placeholder="Enter password" required autocomplete="current-password">
                </div>
                <button type="submit" class="submit-btn manager-btn">Login as Manager</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDK Compat libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script src="script.js"></script>
    <script>
        let currentSelectedRole = 'employee';

        function selectRole(role) {
            currentSelectedRole = role;
            document.querySelectorAll('.role-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.login-panel').forEach(panel => panel.classList.add('hidden'));

            if (role === 'employee') {
                document.querySelectorAll('.role-tab')[0].classList.add('active');
                document.getElementById('panel-employee').classList.remove('hidden');
            } else if (role === 'operator') {
                document.querySelectorAll('.role-tab')[1].classList.add('active');
                document.getElementById('panel-operator').classList.remove('hidden');
            } else if (role === 'manager') {
                document.querySelectorAll('.role-tab')[2].classList.add('active');
                document.getElementById('panel-manager').classList.remove('hidden');
            }
            hideAlert();
        }

        function showAlert(msg) {
            const alertBox = document.getElementById('alert-box');
            alertBox.textContent = msg;
            alertBox.classList.remove('hidden');
        }

        function hideAlert() {
            const alertBox = document.getElementById('alert-box');
            alertBox.textContent = '';
            alertBox.classList.add('hidden');
        }

        async function loginEmployeeGoogle() {
            hideAlert();
            try {
                await signInWithGoogleEmployee();
            } catch (err) {
                showAlert("Google Sign-In Error: " + err.message);
            }
        }

        async function loginOperator(e) {
            e.preventDefault();
            hideAlert();
            const user = document.getElementById('op-username').value.trim();
            const pass = document.getElementById('op-password').value.trim();

            if (!user || !pass) {
                showAlert("Please enter username and passcode.");
                return;
            }

            try {
                const docSnap = await db.collection('system_credentials').doc('operator').get();
                if (docSnap.exists) {
                    const data = docSnap.data();
                    if (data.username === user && data.password === pass) {
                        localStorage.setItem('current_user_name', user);
                        localStorage.setItem('current_user_role', 'operator');
                        localStorage.setItem('active_operator_session', 'true');
                        window.location.href = 'operator.html';
                        return;
                    }
                }

                if (user === 'operator' && pass === 'op1234') {
                    localStorage.setItem('current_user_name', user);
                    localStorage.setItem('current_user_role', 'operator');
                    localStorage.setItem('active_operator_session', 'true');
                    window.location.href = 'operator.html';
                } else {
                    showAlert("Invalid Operator Credentials.");
                }
            } catch (err) {
                if (user === 'operator' && pass === 'op1234') {
                    localStorage.setItem('current_user_name', user);
                    localStorage.setItem('current_user_role', 'operator');
                    localStorage.setItem('active_operator_session', 'true');
                    window.location.href = 'operator.html';
                } else {
                    showAlert("Authentication Error: " + err.message);
                }
            }
        }

        async function loginManager(e) {
            e.preventDefault();
            hideAlert();
            const user = document.getElementById('mgr-username').value.trim();
            const pass = document.getElementById('mgr-password').value.trim();

            if (!user || !pass) {
                showAlert("Please enter manager username and password.");
                return;
            }

            try {
                const docSnap = await db.collection('system_credentials').doc('manager').get();
                if (docSnap.exists) {
                    const data = docSnap.data();
                    if (data.username === user && data.password === pass) {
                        localStorage.setItem('current_user_name', user);
                        localStorage.setItem('current_user_role', 'manager');
                        localStorage.setItem('active_manager_session', 'true');
                        window.location.href = 'manager.html';
                        return;
                    }
                }

                if (user === 'admin' && pass === 'admin1234') {
                    localStorage.setItem('current_user_name', user);
                    localStorage.setItem('current_user_role', 'manager');
                    localStorage.setItem('active_manager_session', 'true');
                    window.location.href = 'manager.html';
                } else {
                    showAlert("Invalid Manager Credentials.");
                }
            } catch (err) {
                if (user === 'admin' && pass === 'admin1234') {
                    localStorage.setItem('current_user_name', user);
                    localStorage.setItem('current_user_role', 'manager');
                    localStorage.setItem('active_manager_session', 'true');
                    window.location.href = 'manager.html';
                } else {
                    showAlert("Authentication Error: " + err.message);
                }
            }
        }
    </script>
</body>
</html>
