<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Plus Institute - Student Directory</title>
    <link rel="stylesheet" href="style.css">
    <!-- SheetJS for Excel Exports -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- Unified Navigation Bar -->
    <header class="top-nav">
        <div class="nav-left">
            <h2 id="nav-portal-title">Training Plus Institute</h2>
            <div class="search-container" id="search-box">
                <input type="text" id="search-input" placeholder="Search courses, names, or CPR..." oninput="handleSearch()">
            </div>
        </div>
        <div class="nav-controls">
            <button id="lang-toggle-btn" class="nav-btn" onclick="toggleLanguage()">AR / EN</button>
            <button id="account-btn" class="nav-btn" onclick="openAccountModal()">Account</button>
            <button id="logout-btn" class="nav-btn logout-btn" onclick="logoutUser()">Logout</button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-container">
        
        <!-- Add Student Form -->
        <section class="card-section">
            <h3 id="lbl-add-student">Add New Student Record</h3>
            <div class="form-grid">
                <input type="text" id="std-name" placeholder="Full Student Name">
                <input type="text" id="cpr-input" placeholder="9-Digit CPR or Phone Number">
                
                <select id="std-status">
                    <option value="Under Processing">Under Processing</option>
                    <option value="Accepted">Accepted</option>
                    <option value="Withdrawn">Withdrawn</option>
                </select>

                <input type="text" id="std-comment" placeholder="Comments / Notes">
                <button class="primary-btn" onclick="addStudentWithCprOrPhone()">Add Student</button>
            </div>
        </section>

        <!-- Student Directory Table -->
        <section class="card-section">
            <h3>Registered Students Roster</h3>
            <div class="table-wrapper">
                <table id="students-table">
                    <thead>
                        <tr>
                            <th>Student Name</th>
                            <th>CPR / Phone</th>
                            <th>Tamkeen Status</th>
                            <th>Comments</th>
                            <th>Added By (Employee)</th>
                            <th>Program Start (Calendar)</th>
                            <th>Expiry (12-Mo)</th>
                            <th>Transfer to Class</th>
                        </tr>
                    </thead>
                    <tbody id="students-table-body">
                        <!-- Dynamic Rows -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- Unified Footer -->
    <footer class="bottom-footer">
        <p id="live-footer-datetime">Loading date & time...</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
