<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Directory & Operator Portal</title>

  <!-- Firebase v8 SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <!-- SheetJS Library for Excel Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    :root {
      --bg-color: #f2f7f5;
      --card-bg: #ffffff;
      --text-primary: #2d3748;
      --text-muted: #718096;
      --border-color: #e2e8f0;
      --accent-mint: #a8e6cf;
      --accent-mint-dark: #81c784;
      --accent-slate-blue: #709fb0;
      --danger-red: #e57373;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      padding-bottom: 70px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header & Navigation */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--accent-slate-blue);
      padding: 12px 24px;
      color: white;
    }

    .nav-controls { display: flex; gap: 8px; }

    .nav-btn {
      background-color: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 7px 14px;
      border-radius: 18px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background-color 0.2s ease;
    }

    .nav-btn:hover { background-color: rgba(255, 255, 255, 0.35); }

    /* Main Container & Cards */
    main { flex: 1; width: 100%; }

    .card-view {
      max-width: 850px;
      margin: 30px auto;
      background: var(--card-bg);
      padding: 28px;
      border-radius: 16px;
      border: 1px solid #e8f0ec;
      box-shadow: 0 8px 20px rgba(0,0,0,0.04);
    }

    .view { display: none; }
    .view.active { display: block; }

    /* Forms & Inputs */
    .standard-form { display: flex; flex-direction: column; gap: 16px; }
    .standard-form label, .grid-form label {
      display: flex;
      flex-direction: column;
      font-size: 0.88rem;
      gap: 4px;
      font-weight: 600;
    }

    .standard-form input, .grid-form input, .grid-form select {
      padding: 10px 12px;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      font-size: 0.9rem;
    }

    .standard-form input:focus, .grid-form input:focus, .grid-form select:focus {
      border-color: var(--accent-slate-blue);
    }

    .primary-btn {
      background-color: var(--accent-mint);
      color: #2c5244;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .primary-btn:hover { background-color: var(--accent-mint-dark); color: white; }

    .secondary-btn {
      background-color: #edf2f0;
      color: var(--text-muted);
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .secondary-btn:hover {
      background-color: var(--border-color);
      color: var(--text-primary);
    }

    /* Grid Display */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      margin-top: 1rem;
    }

    .grid-item {
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: 12px;
      border: 1px solid #e1ebe6;
      text-align: center;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .grid-item:hover {
      border-color: var(--accent-slate-blue);
      color: var(--accent-slate-blue);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(112, 159, 176, 0.15);
    }

    .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }

    /* Student Directory Table */
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card-bg);
      margin-top: 1rem;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 12px 14px;
      text-align: left;
      font-size: 0.88rem;
    }

    th { background-color: #f4f9f7; font-weight: 600; }

    /* RTL Support */
    body[dir="rtl"] { direction: rtl; text-align: right; }
    body[dir="rtl"] th, body[dir="rtl"] td { text-align: right; }

    /* Footer */
    .bottom-footer {
      position: fixed; bottom: 0; left: 0; width: 100%;
      background-color: #1a202c; color: #a0aec0; text-align: center;
      padding: 8px; font-size: 0.82rem; z-index: 900;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="top-nav">
    <h2 id="txt-app-title" style="font-size: 1.25rem; font-weight: 600;">Student Directory & Operator Portal</h2>
    <div class="nav-controls">
      <button class="nav-btn" onclick="showView('directory-view')" id="nav-directory">Directory</button>
      <button class="nav-btn" onclick="showView('courses-view')" id="nav-courses">Courses & Classes</button>
      <button class="nav-btn" onclick="showView('add-course-view')" id="nav-add-course">Add Course</button>
      <button class="nav-btn" onclick="showView('account-view')" id="nav-account">Operator Account</button>
      <button class="nav-btn" onclick="toggleLanguage()" id="lang-btn">AR / EN</button>
    </div>
  </header>

  <!-- Main Application Body -->
  <main>

    <!-- 1. Student Directory View -->
    <section id="directory-view" class="card-view view active">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 id="txt-std-directory">Student Directory</h3>
        <button onclick="exportToExcel()" class="primary-btn" id="btn-export-excel">Download Excel</button>
      </div>

      <!-- Add Student Form -->
      <div style="background: #f8faf9; padding: 16px; border-radius: 12px; border: 1px solid #e1ebe6; margin-bottom: 20px;">
        <h4 id="txt-add-std-title" style="margin-bottom: 12px;">Add Student Record</h4>
        <form id="add-student-form" class="grid-form" onsubmit="addStudent(event)">
          <label id="lbl-std-name">
            Student Name
            <input type="text" id="std-name" required>
          </label>
          <label id="lbl-std-cpr">
            Student CPR
            <input type="text" id="std-cpr" maxlength="9" pattern="\d{9}" placeholder="9-digit CPR" required>
          </label>
          <label id="lbl-std-status">
            Tamkeen Status
            <select id="std-status">
              <option value="Accepted" id="opt-st-acc">Accepted</option>
              <option value="Under Processing" id="opt-st-proc">Under Processing</option>
              <option value="Withdrawn" id="opt-st-with">Withdrawn</option>
            </select>
          </label>
          <label id="lbl-std-comment">
            Comment
            <input type="text" id="std-comment">
          </label>
          <div style="grid-column: 1 / -1; display: flex; align-items: flex-end;">
            <button type="submit" class="primary-btn" id="btn-add-student">Add Student</button>
          </div>
        </form>
      </div>

      <!-- Directory Table -->
      <table id="students-table">
        <thead>
          <tr>
            <th id="th-std-name">Student Name</th>
            <th id="th-std-cpr">Student CPR</th>
            <th id="th-std-status">Tamkeen Status</th>
            <th id="th-std-comment">Comment</th>
          </tr>
        </thead>
        <tbody id="students-table-body">
          <!-- Populated dynamically -->
        </tbody>
      </table>
    </section>

    <!-- 2. Courses View -->
    <section id="courses-view" class="card-view view">
      <h3 id="txt-available-courses" style="margin-bottom: 16px;">Available Courses</h3>
      <div id="courses-list" class="grid"></div>
    </section>

    <!-- 3. Add Course View -->
    <section id="add-course-view" class="card-view view">
      <h3 id="txt-add-course-title" style="margin-bottom: 16px;">Add New Course</h3>
      <form id="add-course-form" class="standard-form" onsubmit="addCourse(event)">
        <label id="lbl-course-name" for="course-name">
          Course Name
          <input type="text" id="course-name" required placeholder="e.g., Web Development">
        </label>
        <div>
          <button type="submit" class="primary-btn" id="btn-add-course">Add Course</button>
        </div>
      </form>
    </section>

    <!-- 4. Classes View -->
    <section id="classes-view" class="card-view view">
      <button class="secondary-btn" onclick="showView('courses-view')" id="btn-back-courses" style="margin-bottom: 1rem;">&larr; Back to Courses</button>
      <h3 id="current-course-title" style="margin-bottom: 16px;">Classes</h3>

      <div style="margin-top: 1rem; border-top: 1px solid var(--border-color); padding-top: 16px;">
        <h4 id="txt-add-class-title" style="margin-bottom: 12px;">Add New Class</h4>
        <form id="add-class-form" class="standard-form" onsubmit="addClass(event)">
          <label id="lbl-class-name" for="class-name">
            Class Name / Code
            <input type="text" id="class-name" required placeholder="e.g., Class A - Morning">
          </label>
          <div>
            <button type="submit" class="primary-btn" id="btn-add-class">Add Class</button>
          </div>
        </form>
      </div>

      <div id="classes-list" class="grid" style="margin-top: 20px;"></div>
    </section>

    <!-- 5. Operator Account View -->
    <section id="account-view" class="card-view view">
      <h3 id="txt-account-settings" style="margin-bottom: 16px;">Operator Account Settings</h3>
      <form id="account-form" class="standard-form" onsubmit="saveAccountDetails(event)">
        <label id="lbl-acc-email" for="acc-email">
          Signed-In Email (Default / Locked)
          <input type="email" id="acc-email" value="operator@institute.com" disabled>
        </label>
        <label id="lbl-acc-name" for="acc-name">
          Operator Name
          <input type="text" id="acc-name" placeholder="Enter full name" required>
        </label>
        <label id="lbl-acc-phone" for="acc-phone">
          Phone Number
          <input type="text" id="acc-phone" placeholder="Enter phone number">
        </label>
        <label id="lbl-acc-role" for="acc-role">
          Role / Department
          <select id="acc-role">
            <option value="System Administrator" id="opt-role-admin">System Administrator</option>
            <option value="Operator" id="opt-role-op">Operator</option>
            <option value="Course Coordinator" id="opt-role-coord">Course Coordinator</option>
          </select>
        </label>
        <div>
          <button type="submit" class="primary-btn" id="btn-save-acc">Save Changes</button>
        </div>
      </form>
    </section>

  </main>

  <!-- Live Footer -->
  <footer class="bottom-footer">
    <p id="live-footer-datetime">Loading date & time...</p>
  </footer>

  <script>
    // Global Application State
    let state = {
      accountDetails: {
        name: "Admin Operator",
        phone: "+973 36000000",
        role: "System Administrator"
      },
      courses: [],
      allStudents: [],
      selectedCourseIndex: null,
      selectedClassIndex: null,
      currentLang: 'EN'
    };

    const translations = {
      EN: {
        appTitle: "Student Directory & Operator Portal",
        navDirectory: "Directory",
        navCourses: "Courses & Classes",
        navAddCourse: "Add Course",
        navAccount: "Operator Account",
        stdDirectory: "Student Directory",
        addCourseTitle: "Add New Course",
        lblCourseName: "Course Name",
        btnAddCourse: "Add Course",
        availableCourses: "Available Courses",
        accountSettings: "Operator Account Settings",
        lblAccEmail: "Signed-In Email (Default / Locked)",
        lblAccName: "Operator Name",
        lblAccPhone: "Phone Number",
        lblAccRole: "Role / Department",
        optAdmin: "System Administrator",
        optOperator: "Operator",
        optCoord: "Course Coordinator",
        btnSaveAcc: "Save Changes",
        btnBackCourses: "← Back to Courses",
        addClassTitle: "Add New Class",
        lblClassName: "Class Name / Code",
        btnAddClass: "Add Class",
        btnExportExcel: "Download Excel",
        addStdTitle: "Add Student Record",
        lblStdName: "Student Name",
        lblStdCpr: "Student CPR",
        lblStdStatus: "Tamkeen Status",
        lblStdComment: "Comment",
        optAccepted: "Accepted",
        optProcessing: "Under Processing",
        optWithdrawn: "Withdrawn",
        btnAddStudent: "Add Student",
        thName: "Student Name",
        thCpr: "Student CPR",
        thStatus: "Tamkeen Status",
        thComment: "Comment"
      },
      AR: {
        appTitle: "دليل الطلاب وبوابة المشغل",
        navDirectory: "دليل الطلاب",
        navCourses: "الدورات والفصول",
        navAddCourse: "إضافة دورة",
        navAccount: "حساب المشغل",
        stdDirectory: "دليل الطلاب",
        addCourseTitle: "إضافة دورة جديدة",
        lblCourseName: "اسم الدورة",
        btnAddCourse: "إضافة دورة",
        availableCourses: "الدورات المتاحة",
        accountSettings: "إعدادات حساب المشغل",
        lblAccEmail: "البريد الإلكتروني المسجل (مغلق)",
        lblAccName: "اسم المشغل",
        lblAccPhone: "رقم الهاتف",
        lblAccRole: "الدور / القسم",
        optAdmin: "مدير النظام",
        optOperator: "مشغل",
        optCoord: "منسق دورات",
        btnSaveAcc: "حفظ التغييرات",
        btnBackCourses: "الرجوع إلى الدورات →",
        addClassTitle: "إضافة فصل جديد",
        lblClassName: "اسم / رمز الفصل",
        btnAddClass: "إضافة فصل",
        btnExportExcel: "تنزيل ملف إكسل",
        addStdTitle: "إضافة سجل طالب",
        lblStdName: "اسم الطالب",
        lblStdCpr: "الرقم الشخصي (CPR)",
        lblStdStatus: "حالة تمكين",
        lblStdComment: "ملاحظات",
        optAccepted: "مقبول",
        optProcessing: "قيد المعالجة",
        optWithdrawn: "منسحب",
        btnAddStudent: "إضافة طالب",
        thName: "اسم الطالب",
        thCpr: "الرقم الشخصي (CPR)",
        thStatus: "حالة تمكين",
        thComment: "ملاحظات"
      }
    };

    function showView(viewId) {
      document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
    }

    function toggleLanguage() {
      state.currentLang = state.currentLang === 'EN' ? 'AR' : 'EN';
      const dict = translations[state.currentLang];
      document.body.dir = state.currentLang === 'AR' ? 'rtl' : 'ltr';

      document.getElementById('txt-app-title').innerText = dict.appTitle;
      document.getElementById('nav-directory').innerText = dict.navDirectory;
      document.getElementById('nav-courses').innerText = dict.navCourses;
      document.getElementById('nav-add-course').innerText = dict.navAddCourse;
      document.getElementById('nav-account').innerText = dict.navAccount;

      document.getElementById('txt-std-directory').innerText = dict.stdDirectory;
      document.getElementById('btn-export-excel').innerText = dict.btnExportExcel;
      document.getElementById('txt-add-std-title').innerText = dict.addStdTitle;

      document.getElementById('lbl-std-name').childNodes[0].nodeValue = dict.lblStdName + " ";
      document.getElementById('lbl-std-cpr').childNodes[0].nodeValue = dict.lblStdCpr + " ";
      document.getElementById('lbl-std-status').childNodes[0].nodeValue = dict.lblStdStatus + " ";
      document.getElementById('lbl-std-comment').childNodes[0].nodeValue = dict.lblStdComment + " ";

      document.getElementById('opt-st-acc').innerText = dict.optAccepted;
      document.getElementById('opt-st-proc').innerText = dict.optProcessing;
      document.getElementById('opt-st-with').innerText = dict.optWithdrawn;
      document.getElementById('btn-add-student').innerText = dict.btnAddStudent;

      document.getElementById('th-std-name').innerText = dict.thName;
      document.getElementById('th-std-cpr').innerText = dict.thCpr;
      document.getElementById('th-std-status').innerText = dict.thStatus;
      document.getElementById('th-std-comment').innerText = dict.thComment;

      document.getElementById('txt-add-course-title').innerText = dict.addCourseTitle;
      document.getElementById('lbl-course-name').childNodes[0].nodeValue = dict.lblCourseName + " ";
      document.getElementById('btn-add-course').innerText = dict.btnAddCourse;
      document.getElementById('txt-available-courses').innerText = dict.availableCourses;

      document.getElementById('btn-back-courses').innerText = dict.btnBackCourses;
      document.getElementById('txt-add-class-title').innerText = dict.addClassTitle;
      document.getElementById('lbl-class-name').childNodes[0].nodeValue = dict.lblClassName + " ";
      document.getElementById('btn-add-class').innerText = dict.btnAddClass;

      document.getElementById('txt-account-settings').innerText = dict.accountSettings;
      document.getElementById('lbl-acc-email').childNodes[0].nodeValue = dict.lblAccEmail + " ";
      document.getElementById('lbl-acc-name').childNodes[0].nodeValue = dict.lblAccName + " ";
      document.getElementById('lbl-acc-phone').childNodes[0].nodeValue = dict.lblAccPhone + " ";
      document.getElementById('lbl-acc-role').childNodes[0].nodeValue = dict.lblAccRole + " ";

      updateDateTime();
    }

    function addStudent(e) {
      e.preventDefault();
      const name = document.getElementById('std-name').value;
      const cpr = document.getElementById('std-cpr').value;
      const status = document.getElementById('std-status').value;
      const comment = document.getElementById('std-comment').value;

      state.allStudents.push({ name, cpr, status, comment });
      document.getElementById('add-student-form').reset();
      renderStudents();
    }

    function renderStudents() {
      const tbody = document.getElementById('students-table-body');
      tbody.innerHTML = '';
      state.allStudents.forEach(std => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${std.name}</td>
          <td>${std.cpr}</td>
          <td>${std.status}</td>
          <td>${std.comment}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function addCourse(e) {
      e.preventDefault();
      const input = document.getElementById('course-name');
      state.courses.push({ name: input.value, classes: [] });
      input.value = '';
      renderCourses();
      showView('courses-view');
    }

    function renderCourses() {
      const container = document.getElementById('courses-list');
      container.innerHTML = '';
      state.courses.forEach((course, index) => {
        const div = document.createElement('div');
        div.className = 'grid-item';
        div.innerText = course.name;
        div.onclick = () => openCourse(index);
        container.appendChild(div);
      });
    }

    function openCourse(index) {
      state.selectedCourseIndex = index;
      const prefix = state.currentLang === 'AR' ? 'الفصول لـ ' : 'Classes for ';
      document.getElementById('current-course-title').innerText = `${prefix}${state.courses[index].name}`;
      renderClasses();
      showView('classes-view');
    }

    function addClass(e) {
      e.preventDefault();
      const input = document.getElementById('class-name');
      state.courses[state.selectedCourseIndex].classes.push({ name: input.value });
      input.value = '';
      renderClasses();
    }

    function renderClasses() {
      const container = document.getElementById('classes-list');
      container.innerHTML = '';
      const currentClasses = state.courses[state.selectedCourseIndex].classes;
      currentClasses.forEach((cls) => {
        const div = document.createElement('div');
        div.className = 'grid-item';
        div.innerText = cls.name;
        container.appendChild(div);
      });
    }

    function saveAccountDetails(e) {
      e.preventDefault();
      state.accountDetails.name = document.getElementById('acc-name').value;
      state.accountDetails.phone = document.getElementById('acc-phone').value;
      state.accountDetails.role = document.getElementById('acc-role').value;
      alert(state.currentLang === 'AR' ? 'تم تحديث بيانات الحساب!' : 'Account details updated!');
    }

    function exportToExcel() {
      const table = document.getElementById('students-table');
      const workbook = XLSX.utils.table_to_book(table, { sheet: "Students" });
      XLSX.writeFile(workbook, "student_directory.xlsx");
    }

    function updateDateTime() {
      const now = new Date();
      const locale = state.currentLang === 'AR' ? 'ar-BH' : 'en-US';

      const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit' };

      const gregorianDate = now.toLocaleDateString(locale, dateOptions);
      const timeString = now.toLocaleTimeString(locale, timeOptions);
      const hijriDate = new Intl.DateTimeFormat(locale + '-u-ca-islamic', dateOptions).format(now);

      const targetEl = document.getElementById('live-footer-datetime');
      if (targetEl) {
        targetEl.innerText = `${gregorianDate} | ${hijriDate} | ${timeString}`;
      }
    }

    setInterval(updateDateTime, 1000);
    updateDateTime();
  </script>
</body>
</html>
